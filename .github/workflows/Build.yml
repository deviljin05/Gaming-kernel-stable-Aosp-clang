name: Build GKI Kernel - Neutron Clang

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Kernel branch/tag, e.g. android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"

      susfs_commit:
        description: "Optional SUSFS commit hash; empty = latest"
        required: false
        default: ""

      device_name:
        description: "Artifact/device name"
        required: true
        default: "gki-custom"

      enable_gaming_perf_tune:
        description: "Enable optional gaming tweaks"
        required: true
        default: "false"

      enable_performance_governor:
        description: "Use performance governor"
        required: true
        default: "false"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  NEUTRON_DIR: /home/runner/toolchains/neutron-clang

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip \
            libncurses-dev ccache zip unzip \
            device-tree-compiler patchelf jq perl

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=5G
          ccache --set-config=compression=true

      - name: Resolve manifest
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ github.event.inputs.os_patch_level }}"

          if [ "$INPUT" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_REF=""
            PIN_TYPE=""
          elif [[ "$INPUT" =~ ^${VERSION}.[0-9]+_r[0-9]+$ ]]; then
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="$INPUT"
            PIN_TYPE="tag"
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="$INPUT"
            PIN_TYPE="branch"
          fi

          echo "MANIFEST_REF=$MANIFEST_REF" >> "$GITHUB_ENV"
          echo "PIN_REF=$PIN_REF" >> "$GITHUB_ENV"
          echo "PIN_TYPE=$PIN_TYPE" >> "$GITHUB_ENV"

      - name: Sync GKI source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Pin kernel common source
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_NAME="$(git remote | head -n1)"
          test -n "$REMOTE_NAME"

          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch --depth=1 "$REMOTE_NAME" \
              "refs/tags/$PIN_REF:refs/tags/$PIN_REF"

            git checkout "refs/tags/$PIN_REF"
          else
            git fetch --depth=1 "$REMOTE_NAME" \
              "refs/heads/$PIN_REF:refs/remotes/$REMOTE_NAME/$PIN_REF"

            git checkout -B "$PIN_REF" \
              "refs/remotes/$REMOTE_NAME/$PIN_REF"
          fi

      - name: Clone SUSFS
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            -b gki-android12-5.10 \
            susfs4ksu

          cd susfs4ksu

          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi

          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup KernelSU Next
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

      - name: Apply SUSFS
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          cp \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            .

          patch -p1 --fuzz=3 \
            < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Configure SUSFS
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          cat >> gki_defconfig <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Fix SUSFS compatibility
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c

      - name: Configure namespaces
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          cat >> gki_defconfig <<'EOF'
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          EOF

      - name: Configure optional performance governor
        if: ${{ github.event.inputs.enable_performance_governor == 'true' }}
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          cat >> gki_defconfig <<'EOF'
          CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=n
          EOF

      - name: Configure optional gaming tweaks
        if: ${{ github.event.inputs.enable_gaming_perf_tune == 'true' }}
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          echo "CONFIG_MODULE_FORCE_LOAD=y" >> gki_defconfig
          echo "CONFIG_WERROR=n" >> gki_defconfig

      - name: Apply kernel branding
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/setlocalversion ]; then
            cp scripts/setlocalversion scripts/setlocalversion.orig
          fi

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf '%s' '-NeutronClang24-KSUNv1-STABLE'
          EOF

          chmod +x scripts/setlocalversion

      - name: Disable optional strict checks
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILES=(
            common/build.config.gki
            common/build.config.gki.aarch64
            common/build.config.common
            build.config.gki
            build.config.gki.aarch64
          )

          for CONFIG in "${CONFIG_FILES[@]}"; do
            if [ ! -f "$CONFIG" ]; then
              continue
            fi

            if grep -q '^check_defconfig' "$CONFIG"; then
              sed -i '/^check_defconfig/d' "$CONFIG"
            fi

            if grep -q '^CHECK_DEFCONFIG=' "$CONFIG"; then
              sed -i 's/^CHECK_DEFCONFIG=.*/CHECK_DEFCONFIG=0/' "$CONFIG"
            fi

            if grep -q '^MODULES_ORDER=' "$CONFIG"; then
              sed -i 's#^MODULES_ORDER=.*#MODULES_ORDER=#' "$CONFIG"
            fi

            if grep -q '^MODULES_LIST=' "$CONFIG"; then
              sed -i 's#^MODULES_LIST=.*#MODULES_LIST=#' "$CONFIG"
            fi
          done

          echo "Strict-check handling completed."

          grep -RInE \
            'check_defconfig|CHECK_DEFCONFIG|MODULES_ORDER|MODULES_LIST' \
            common/build.config* build.config* 2>/dev/null || true

      - name: Setup latest Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_DIR"
          mkdir -p "$NEUTRON_DIR"

          cd "$NEUTRON_DIR"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman
          ./antman -S=latest

          test -d "$NEUTRON_DIR/bin"
          test -x "$NEUTRON_DIR/bin/clang-24"
          test -x "$NEUTRON_DIR/bin/llvm-ar"
          test -x "$NEUTRON_DIR/bin/lld"

          echo "NEUTRON_BIN=$NEUTRON_DIR/bin" >> "$GITHUB_ENV"
          echo "$NEUTRON_DIR/bin" >> "$GITHUB_PATH"

      - name: Create Neutron aliases
        shell: bash
        run: |
          set -euo pipefail

          cd "$NEUTRON_BIN"

          ln -sfn clang-24 clang
          ln -sfn clang-24 clang++
          ln -sfn lld ld.lld

          test "$(readlink -f clang)" \
            = "$NEUTRON_BIN/clang-24"

          test "$(readlink -f clang++)" \
            = "$NEUTRON_BIN/clang-24"

          test "$(readlink -f ld.lld)" \
            = "$NEUTRON_BIN/lld"

      - name: Show runner resources
        shell: bash
        run: |
          set -euo pipefail

          free -h
          nproc
          df -h

      - name: Verify Neutron toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_BIN:$PATH"

          CLANG_PATH="$(readlink -f "$(command -v clang)")"
          CLANGXX_PATH="$(readlink -f "$(command -v clang++)")"
          LD_PATH="$(readlink -f "$(command -v ld.lld)")"

          test "$CLANG_PATH" = "$NEUTRON_BIN/clang-24"
          test "$CLANGXX_PATH" = "$NEUTRON_BIN/clang-24"
          test "$LD_PATH" = "$NEUTRON_BIN/lld"

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          clang --version | tee \
            "$GITHUB_WORKSPACE/build-info/neutron-clang-version.txt"

          llvm-ar --version | tee \
            "$GITHUB_WORKSPACE/build-info/llvm-ar-version.txt"

          ld.lld --version | tee \
            "$GITHUB_WORKSPACE/build-info/lld-version.txt"

          grep -qiE \
            'Neutron clang version 24|clang version 24' \
            "$GITHUB_WORKSPACE/build-info/neutron-clang-version.txt"

      - name: Force Neutron build variables
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="common/build.config.gki.aarch64"
          test -f "$CONFIG"

          sed -i '/^CLANG_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM=/d' "$CONFIG"
          sed -i '/^LLVM_IAS=/d' "$CONFIG"
          sed -i '/^CC=/d' "$CONFIG"
          sed -i '/^HOSTCC=/d' "$CONFIG"
          sed -i '/^HOSTCXX=/d' "$CONFIG"
          sed -i '/^LD=/d' "$CONFIG"
          sed -i '/^AR=/d' "$CONFIG"
          sed -i '/^NM=/d' "$CONFIG"
          sed -i '/^OBJCOPY=/d' "$CONFIG"
          sed -i '/^OBJDUMP=/d' "$CONFIG"
          sed -i '/^READELF=/d' "$CONFIG"
          sed -i '/^STRIP=/d' "$CONFIG"

          cat >> "$CONFIG" <<EOF
          CLANG_PREBUILT_BIN=$NEUTRON_BIN/
          LLVM_PREBUILT_BIN=$NEUTRON_BIN/
          LLVM=1
          LLVM_IAS=1
          CC=clang
          HOSTCC=clang
          HOSTCXX=clang++
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          STRIP=llvm-strip
          EOF

          grep -E \
            'CLANG_PREBUILT_BIN|LLVM_PREBUILT_BIN|^LLVM=|^CC=|^LD=|^AR=' \
            "$CONFIG"

      - name: Remove stale compiler metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing stale compiler metadata..."

          find . \
            -path '*/include/generated/compile.h' \
            -type f \
            -delete || true

          find . \
            -name '.version' \
            -type f \
            -delete || true

          echo "Compiler metadata cleanup completed."

      - name: Build kernel with Neutron Clang
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_BIN:$PATH"

          export CLANG_PREBUILT_BIN="$NEUTRON_BIN/"
          export LLVM_PREBUILT_BIN="$NEUTRON_BIN/"
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export LTO=thin
          export LLVM_PARALLEL_LINK_JOBS=1
          export LLVM_PARALLEL_COMPILE_JOBS=2
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github-runner

          test "$(readlink -f "$(command -v clang)")" \
            = "$NEUTRON_BIN/clang-24"

          test "$(readlink -f "$(command -v ld.lld)")" \
            = "$NEUTRON_BIN/lld"

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          LTO=thin \
          build/build.sh -j2

      - name: Verify final compiler metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_H="$(
            find out \
              -path '*/include/generated/compile.h' \
              -type f |
            head -n1
          )"

          if [ -z "$COMPILE_H" ] || [ ! -f "$COMPILE_H" ]; then
            echo "::error::compile.h was not generated"
            exit 1
          fi

          echo "===== FINAL compile.h ====="
          cat "$COMPILE_H"

          if ! grep -qiE \
            'Neutron clang version 24|clang version 24' \
            "$COMPILE_H"; then
            echo "::error::Final kernel does not report Neutron Clang 24"
            exit 1
          fi

          if grep -qi 'clang version 12' "$COMPILE_H"; then
            echo "::error::Final kernel still reports Clang 12"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$COMPILE_H" \
            "$GITHUB_WORKSPACE/build-info/compile.h"

          grep -E \
            'LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST' \
            "$COMPILE_H" \
            > "$GITHUB_WORKSPACE/build-info/compiler-proof.txt"

      - name: Locate final Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(find out \
            -path '*/dist/Image' \
            -type f |
            head -n1)"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(find out \
              -name Image \
              -type f |
              head -n1)"
          fi

          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::Final Image was not found"
            find out -maxdepth 5 -type f | sort || true
            exit 1
          fi

          echo "Found Image: $IMAGE"

          echo "IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/$IMAGE" \
            >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          sha256sum "$IMAGE" | tee \
            "$GITHUB_WORKSPACE/build-info/Image.sha256"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            ak3

          cp "$IMAGE_PATH" ak3/Image

          SOURCE_HASH="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
          PACKAGE_HASH="$(sha256sum ak3/Image | awk '{print $1}')"

          test "$SOURCE_HASH" = "$PACKAGE_HASH"

          mkdir -p build-info

          echo "$SOURCE_HASH  Image" \
            > build-info/packaged-Image.sha256

          cd ak3

          ZIP_NAME="${{ github.event.inputs.device_name }}-NeutronClang24-Kernel.zip"

          zip -r9 -q "../$ZIP_NAME" . -x ".git*"

          cd ..

          sha256sum "$ZIP_NAME" \
            > build-info/kernel-zip.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-NeutronClang24-build
          path: |
            *.zip
            build-info/**
          if-no-files-found: error
          retention-days: 14

      - name: OOM diagnostics
        if: always()
        shell: bash
        run: |
          free -h || true

          dmesg -T 2>/dev/null |
            grep -iE 'oom|out of memory|killed process' || true
