name: Build GKI Kernel

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "lts or exact GKI tag"
        required: true
        default: "android12-5.10.264_r00"
      susfs_commit:
        description: "SUSFS commit hash"
        required: false
        default: ""
      device_name:
        description: "Artifact label"
        required: false
        default: "gki-custom"
      compiler_release:
        description: "Neutron Clang release tag"
        required: false
        default: "latest"

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  TOOLCHAIN_DIR: /home/runner/toolchains/neutron-clang

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git curl bc bison flex libssl-dev build-essential \
            python3 python3-pip libncurses-dev ccache zip unzip \
            device-tree-compiler patchelf file

      - name: Repo tool
        run: |
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ccache
        run: mkdir -p "$CCACHE_DIR"

      - name: Neutron toolchain
        run: |
          set -euo pipefail
          mkdir -p "$TOOLCHAIN_DIR"
          cd "$TOOLCHAIN_DIR"
          curl -fsSL -o antman https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman
          ./antman -S="${{ github.event.inputs.compiler_release }}"
          # NOTE: --patch=glibc removed on purpose.
          # It was failing with "wget ... Error: Process completed with exit code 8"
          # because antman's glibc patch script pulls a pinned package filename
          # from a rolling-release Arch Linux mirror, which frequently 404s once
          # that package version is superseded upstream.
          # This patch exists only to make the Clang binary run on hosts with an
          # older/incompatible glibc (e.g. Ubuntu 20.04). Since this workflow runs
          # on ubuntu-22.04, the host glibc is new enough already, so the patch
          # is not needed here.
          test -x "$TOOLCHAIN_DIR/bin/clang"
          test -x "$TOOLCHAIN_DIR/bin/ld.lld"

      - name: Verify toolchain
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          clang --version | head -n1
          ld.lld --version | head -n1
          if clang --version | head -n1 | grep -qi 'clang version 12'; then
            echo "Android clang 12 detected, aborting"
            exit 1
          fi

      - name: Resolve manifest
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "$INPUT" = "lts" ]; then
            echo "MANIFEST_REF=common-${VERSION}-lts" >> "$GITHUB_ENV"
            echo "PIN_REF=" >> "$GITHUB_ENV"
            echo "PIN_TYPE=" >> "$GITHUB_ENV"
          elif [[ "$INPUT" =~ ^${VERSION}.[0-9]+_r[0-9]+$ ]]; then
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
            echo "PIN_TYPE=tag" >> "$GITHUB_ENV"
          else
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
            echo "PIN_TYPE=branch" >> "$GITHUB_ENV"
          fi

      - name: Sync kernel
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "$MANIFEST_REF" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Pin common
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          R="$(git remote | head -n1)"
          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch --depth=1 "$R" "refs/tags/$PIN_REF:refs/tags/$PIN_REF"
            git checkout "refs/tags/$PIN_REF"
          else
            git fetch --depth=1 "$R" "refs/heads/$PIN_REF:refs/remotes/$R/$PIN_REF"
            git checkout -B "$PIN_REF" "refs/remotes/$R/$PIN_REF"
          fi

      - name: Sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          echo "SUBLEVEL=$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: SUSFS source
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: SUSFS config
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y"
          } >> gki_defconfig

      - name: Copy SUSFS
        run: |
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Prep fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "$SUBLEVEL" -le "43" ]; then
            perl -i -pe 's/(int|size_t)s+this_lens*=s*min_ts*(s*\u0001s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "$SUBLEVEL" -le "117" ]; then
            sed -i '#^[[:space:]]*/*$#,#^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$#d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi
          if [ "$SUBLEVEL" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' fs/proc/task_mmu.c
          fi

      - name: SUSFS patch
        working-directory: kernel_workspace/common
        run: patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: SUSFS nameidata
        working-directory: kernel_workspace/common
        run: sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: KSU next
        working-directory: kernel_workspace/common
        run: curl -fsSL "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: KSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail
          curl -fsSL -o static.patch https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch
          patch -p1 --forward < static.patch || true

      - name: BBRv3
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_CONG_NAME="bbr"
          BBRV3_PATCH_APPLIED="false"
          if [ -f "$BBRV3_PATCH" ] && patch -p1 < "$BBRV3_PATCH"; then
            BBRV3_PATCH_APPLIED="true"
            DETECTED="$(grep -rhoE '.names*=s*"[a-zA-Z0-9_]+"' net/ipv4/tcp_bbr*.c 2>/dev/null | grep -oE '"[a-zA-Z0-9_]+"' | tr -d '"' | head -n1 || true)"
            [ -n "$DETECTED" ] && BBR_CONG_NAME="$DETECTED"
          fi
          echo "BBR_CONG_NAME=${BBR_CONG_NAME}" >> "$GITHUB_ENV"
          echo "BBRV3_PATCH_APPLIED=${BBRV3_PATCH_APPLIED}" >> "$GITHUB_ENV"

      - name: Net config
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          {
            echo "CONFIG_TCP_CONG_ADVANCED=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_TCP_CONG_CUBIC=y"
            echo "CONFIG_TCP_CONG_BIC=y"
            echo "CONFIG_TCP_CONG_WESTWOOD=y"
            echo "CONFIG_TCP_CONG_HTCP=y"
            if [ "${BBRV3_PATCH_APPLIED}" = "true" ]; then
              echo "CONFIG_TCP_CONG_BBR3=y"
            fi
            echo "CONFIG_DEFAULT_TCP_CONG=${BBR_CONG_NAME}"
            echo "CONFIG_NET_SCH_FQ=y"
            echo "CONFIG_NET_SCH_FQ_CODEL=y"
            echo "CONFIG_NET_SCH_CAKE=y"
          } >> gki_defconfig

      - name: NTSync
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "$SUBLEVEL" -le "208" ]; then
            curl -fsSL -o /tmp/0003-lockdep-assert-none-held.patch https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || true
          fi
          curl -fsSL -o /tmp/ntsync_compat_android12-5.10.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || true
          curl -fsSL -o /tmp/ntsync_base.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || true
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Droidspaces
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          DROIDSPACES_KABI_OK="true"
          curl -fsSL -o /tmp/droidspaces_sysvipc_kabi.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          if ! patch -p1 < /tmp/droidspaces_sysvipc_kabi.patch; then DROIDSPACES_KABI_OK="false"; fi
          curl -fsSL -o /tmp/droidspaces_posix_mqueue_kabi.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          if ! patch -p1 < /tmp/droidspaces_posix_mqueue_kabi.patch; then DROIDSPACES_KABI_OK="false"; fi
          echo "DROIDSPACES_KABI_OK=${DROIDSPACES_KABI_OK}" >> "$GITHUB_ENV"

      - name: Droid config
        run: |
          cd kernel_workspace/common/arch/arm64/configs
          if [ "${DROIDSPACES_KABI_OK}" = "true" ]; then
            {
              echo "CONFIG_SYSVIPC=y"
              echo "CONFIG_POSIX_MQUEUE=y"
              echo "CONFIG_IPC_NS=y"
            } >> gki_defconfig
          fi
          {
            echo "CONFIG_NAMESPACES=y"
            echo "CONFIG_NET_NS=y"
            echo "CONFIG_CGROUPS=y"
            echo "CONFIG_PID_NS=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y"
            echo "CONFIG_NETFILTER_XT_TARGET_REJECT=y"
            echo "CONFIG_NETFILTER_XT_TARGET_LOG=y"
            echo "CONFIG_NETFILTER_XT_MATCH_RECENT=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_IP_SET_HASH_IP=y"
            echo "CONFIG_IP_SET_HASH_NET=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_TMPFS_POSIX_ACL=y"
            echo "CONFIG_TMPFS_XATTR=y"
          } >> gki_defconfig

      - name: Brand
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          mv scripts/setlocalversion scripts/setlocalversion.orig
          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf -- '-BLAZE-KSUNv1-STABLE-NeutronClang'
          EOF
          chmod +x scripts/setlocalversion
          echo 'CONFIG_LOCALVERSION="-NeutronClang"' >> arch/arm64/configs/gki_defconfig

      - name: Remove check_defconfig
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Build
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export LLVM=1
          export CC="$TOOLCHAIN_BIN/clang"
          export LD="$TOOLCHAIN_BIN/ld.lld"
          export AR="$TOOLCHAIN_BIN/llvm-ar"
          export NM="$TOOLCHAIN_BIN/llvm-nm"
          export OBJCOPY="$TOOLCHAIN_BIN/llvm-objcopy"
          export OBJDUMP="$TOOLCHAIN_BIN/llvm-objdump"
          export READELF="$TOOLCHAIN_BIN/llvm-readelf"
          export STRIP="$TOOLCHAIN_BIN/llvm-strip"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export HOSTCC="$TOOLCHAIN_BIN/clang"
          export HOSTCXX="$TOOLCHAIN_BIN/clang++"
          export HOSTLD="$TOOLCHAIN_BIN/ld.lld"
          export BUILD_CONFIG=common/build.config.gki.aarch64
          export USE_CCACHE=1
          export CCACHE_DIR="$CCACHE_DIR"
          export LTO=thin
          build/build.sh -j4 LLVM=1 CC="$TOOLCHAIN_BIN/clang" LD="$TOOLCHAIN_BIN/ld.lld" AR="$TOOLCHAIN_BIN/llvm-ar" NM="$TOOLCHAIN_BIN/llvm-nm" OBJCOPY="$TOOLCHAIN_BIN/llvm-objcopy" OBJDUMP="$TOOLCHAIN_BIN/llvm-objdump" READELF="$TOOLCHAIN_BIN/llvm-readelf" STRIP="$TOOLCHAIN_BIN/llvm-strip" HOSTCC="$TOOLCHAIN_BIN/clang" HOSTCXX="$TOOLCHAIN_BIN/clang++" HOSTLD="$TOOLCHAIN_BIN/ld.lld"

      - name: Verify config
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          CFG="$(find out -name .config | head -n1)"
          grep -q '^CONFIG_CC_IS_CLANG=y$' "$CFG"
          grep -q '^CONFIG_CLANG_VERSION=' "$CFG"

      - name: Compile info
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          HFILE="$(find out -path '*include/generated/compile.h' | head -n1)"
          grep -E 'LINUX_COMPILER|LINUX_COMPILER_VERSION' "$HFILE"

      - name: Verify image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG="$(find out -path '*dist/Image' | head -n1)"
          TMP="$(mktemp)"
          strings "$IMG" > "$TMP"
          if grep -Eqi 'clang 12' "$TMP"; then
            echo "clang 12 still found"
            exit 1
          fi
          grep -Eai -m 50 'clang|neutron|llvm' "$TMP" || true

      - name: Package
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "$(find out -path '*dist/Image' | head -n1)" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Blaze-android12-5.10-susfs${SUSFS_COMMIT:0:8}.zip" . -x ".git*"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
