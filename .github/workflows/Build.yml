name: Build Android 12 GKI - Neutron Clang - All Patches

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Exact Android 12 5.10 tag, branch, or lts"
        required: true
        default: "android12-5.10.264_r00"
        type: string

      susfs_commit:
        description: "Optional SUSFS commit hash"
        required: false
        default: ""
        type: string

      device_name:
        description: "Artifact name"
        required: true
        default: "gki-custom"
        type: string

      compiler_release:
        description: "Neutron release tag or latest"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

env:
  VERSION: android12-5.10
  NEUTRON_HOME: ${{ github.workspace }}/neutron-clang
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  KERNEL_WORKSPACE: ${{ github.workspace }}/kernel_workspace

jobs:
  build:
    name: Build GKI with all patches
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            patchelf \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

          command -v bash
          command -v git
          command -v curl
          command -v python3
          command -v make
          command -v patch

      - name: Configure Git
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install repo
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL --retry 5 --retry-delay 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          test -s "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/repo" --version

      - name: Prepare ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Download Neutron Clang
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_HOME"
          mkdir -p "$NEUTRON_HOME"
          cd "$NEUTRON_HOME"

          curl -fL --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          test -s antman
          chmod +x antman

          RELEASE="${{ inputs.compiler_release }}"

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "latest" ]; then
            ./antman -S
          else
            ./antman -S="$RELEASE"
          fi

          if ! "$NEUTRON_HOME/bin/clang" --version >/dev/null 2>&1; then
            echo "Applying glibc patch for Neutron Clang"
            ./antman --patch=glibc
          fi

          test -x "$NEUTRON_HOME/bin/clang"
          test -x "$NEUTRON_HOME/bin/clang++"
          test -x "$NEUTRON_HOME/bin/ld.lld"
          test -x "$NEUTRON_HOME/bin/llvm-ar"
          test -x "$NEUTRON_HOME/bin/llvm-nm"
          test -x "$NEUTRON_HOME/bin/llvm-objcopy"
          test -x "$NEUTRON_HOME/bin/llvm-objdump"
          test -x "$NEUTRON_HOME/bin/llvm-readelf"
          test -x "$NEUTRON_HOME/bin/llvm-strip"

          echo "TOOLCHAIN_BIN=$NEUTRON_HOME/bin" >> "$GITHUB_ENV"
          echo "$NEUTRON_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron Clang
        run: |
          set -euo pipefail

          test -n "${TOOLCHAIN_BIN:-}"
          "$TOOLCHAIN_BIN/clang" --version
          "$TOOLCHAIN_BIN/clang++" --version
          "$TOOLCHAIN_BIN/ld.lld" --version

          cat > "$RUNNER_TEMP/neutron-test.c" <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          "$TOOLCHAIN_BIN/clang" \
            -O2 \
            -fno-lto \
            -fno-pie \
            -no-pie \
            "$RUNNER_TEMP/neutron-test.c" \
            -o "$RUNNER_TEMP/neutron-test"

          "$RUNNER_TEMP/neutron-test"
          echo "Neutron Clang verification successful."

      - name: Resolve manifest
        run: |
          set -euo pipefail

          INPUT="${{ inputs.os_patch_level }}"

          if [ "$INPUT" = "lts" ]; then
            echo "MANIFEST_REF=common-${VERSION}-lts" >> "$GITHUB_ENV"
            echo "PIN_TYPE=none" >> "$GITHUB_ENV"
            echo "PIN_REF=" >> "$GITHUB_ENV"

          elif [[ "$INPUT" =~ ^android12-5.10.[0-9]+_r[0-9]+$ ]]; then
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=tag" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"

          else
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=branch" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
          fi

          echo "MANIFEST_REF=$MANIFEST_REF"
          echo "PIN_TYPE=$PIN_TYPE"
          echo "PIN_REF=$PIN_REF"

      - name: Initialize kernel source
        run: |
          set -euo pipefail

          mkdir -p "$KERNEL_WORKSPACE"
          cd "$KERNEL_WORKSPACE"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

      - name: Sync kernel source
        working-directory: ${{ env.KERNEL_WORKSPACE }}
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Pin common kernel
        if: ${{ env.PIN_TYPE != 'none' }}
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          REMOTE="$(git remote | head -n1)"

          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch --depth=1 "$REMOTE" "refs/tags/$PIN_REF:refs/tags/$PIN_REF"
            git checkout "refs/tags/$PIN_REF"
          else
            git fetch --depth=1 "$REMOTE" "refs/heads/$PIN_REF:refs/remotes/$REMOTE/$PIN_REF"
            git checkout -B "$PIN_REF" "refs/remotes/$REMOTE/$PIN_REF"
          fi

          git describe --always --dirty

      - name: Read kernel sublevel
        working-directory: ${{ env.KERNEL_WORKSPACE }}
        run: |
          set -euo pipefail

          VALUE="$(
            awk -F '= ' '/^SUBLEVEL = / { print $2; exit }' common/Makefile
          )"

          test -n "$VALUE"
          echo "SUBLEVEL=$VALUE" >> "$GITHUB_ENV"
          echo "Kernel sublevel: $VALUE"

      - name: Clone SUSFS
        working-directory: ${{ env.KERNEL_WORKSPACE }}
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          if [ -n "${{ inputs.susfs_commit }}" ]; then
            cd susfs4ksu
            git fetch --depth=1 origin "${{ inputs.susfs_commit }}"
            git checkout "${{ inputs.susfs_commit }}"
          fi

          echo "SUSFS_COMMIT=$(git -C susfs4ksu rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy SUSFS files
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./50_add_susfs_in_gki-android12-5.10.patch
          test -f 50_add_susfs_in_gki-android12-5.10.patch

      - name: Apply SUSFS patch
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          PATCH_FILE="50_add_susfs_in_gki-android12-5.10.patch"
          if git apply --check --whitespace=nowarn "$PATCH_FILE" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH_FILE"
          else
            echo "SUSFS patch already applied or incompatible."
          fi

      - name: Install KernelSU Next
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs
          test -d KernelSU-Next

      - name: Apply KernelSU static patch
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common/KernelSU-Next
        run: |
          set -euo pipefail
          curl -fsSL \
            -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch
          if git apply --check static.patch 2>/dev/null; then
            git apply static.patch
          else
            echo "KernelSU static patch already applied or incompatible."
          fi

      - name: Apply SUSFS compatibility fixes
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 43 ]; then
            sed -i 's/int[[:space:]]+this_len[[:space:]]*=[[:space:]]*min_t(size_t,/size_t this_len = min_t(size_t,/' fs/proc/base.c || true
          fi

          if [ "$SUBLEVEL" -le 117 ]; then
            sed -i 's/mask,[[:space:]]*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c || true
            sed -i 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c || true
          fi

          if [ "$SUBLEVEL" -le 209 ]; then
            sed -i 's/goto show_pad;/return 0;/g' fs/proc/task_mmu.c || true
          fi

          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c || true

      - name: Apply BBRv3
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          rm -rf /tmp/wildpatches
          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ ! -f "$PATCH" ]; then
            echo "BBRv3 patch file not found."
            exit 1
          fi

          if ! git apply --check "$PATCH" 2>/dev/null; then
            echo "BBRv3 patch does not apply to this kernel revision."
            exit 1
          fi

          git apply "$PATCH"
          echo "BBRV3_APPLIED=true" >> "$GITHUB_ENV"

      - name: Configure BBRv3
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          cat >> arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_BBR3=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_TCP_CONG=bbr
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          EOF

      - name: Apply NTSync
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 208 ]; then
            curl -fsSL \
              -o /tmp/ntsync-lockdep.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch

            if git apply --check /tmp/ntsync-lockdep.patch 2>/dev/null; then
              git apply /tmp/ntsync-lockdep.patch
            else
              echo "NTSync lockdep patch already applied or incompatible."
            fi
          fi

          curl -fsSL \
            -o /tmp/ntsync-compat.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          if git apply --check /tmp/ntsync-compat.patch 2>/dev/null; then
            git apply /tmp/ntsync-compat.patch
          else
            echo "NTSync compatibility patch already applied or incompatible."
          fi

          curl -fsSL \
            -o /tmp/ntsync-base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch

          if git apply --check /tmp/ntsync-base.patch 2>/dev/null; then
            git apply /tmp/ntsync-base.patch
          else
            echo "NTSync base patch already applied or incompatible."
          fi

      - name: Configure NTSync
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces patches
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          curl -fsSL \
            -o /tmp/droidspaces-sysvipc.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          if ! git apply --check /tmp/droidspaces-sysvipc.patch 2>/dev/null; then
            echo "Droidspaces SYSVIPC patch does not apply."
            exit 1
          fi

          git apply /tmp/droidspaces-sysvipc.patch

          curl -fsSL \
            -o /tmp/droidspaces-mqueue.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

          if ! git apply --check /tmp/droidspaces-mqueue.patch 2>/dev/null; then
            echo "Droidspaces POSIX mqueue patch does not apply."
            exit 1
          fi

          git apply /tmp/droidspaces-mqueue.patch

      - name: Configure Droidspaces
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          cat >> arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IPC_NS=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          EOF

      - name: Configure SUSFS
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail
          cat >> arch/arm64/configs/gki_defconfig <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          EOF

      - name: Build kernel
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        env:
          PATH: ${{ env.TOOLCHAIN_BIN }}:${{ env.PATH }}
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export OBJSIZE=llvm-size
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github-actions

          mkdir -p out
          make O=out gki_defconfig
          make O=out -j"$(nproc)" Image.gz dtbo.img modules

      - name: Package artifacts
        working-directory: ${{ env.KERNEL_WORKSPACE }}/common
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/kernel-artifacts"

          find out -type f ( \
            -name "Image" -o \
            -name "Image.gz" -o \
            -name "*.ko" -o \
            -name "*.dtbo" -o \
            -name "*.img" \
          ) -exec cp --parents {} "$RUNNER_TEMP/kernel-artifacts" ;

          cp out/.config "$RUNNER_TEMP/kernel-artifacts/" || true
          cp out/arch/arm64/boot/Image.gz "$RUNNER_TEMP/kernel-artifacts/" 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img "$RUNNER_TEMP/kernel-artifacts/" 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name }}-android12-gki
          path: ${{ runner.temp }}/kernel-artifacts
          if-no-files-found: error
          retention-days: 14
