name: Build GKI Kernel - Neutron Clang

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch/tag"
        required: true
        default: "android12-5.10"

      device_name:
        description: "Artifact name"
        required: true
        default: "gki-kernel"

      susfs_commit:
        description: "Optional SUSFS commit"
        required: false
        default: ""

      enable_performance:
        description: "Enable performance governor"
        required: true
        default: "false"

      enable_gaming:
        description: "Enable gaming tweaks"
        required: true
        default: "false"

env:
  REPO_URL: https://android.googlesource.com/kernel/manifest
  MANIFEST_BRANCH: common-android12-5.10
  NEUTRON_DIR: /home/runner/toolchains/neutron-clang
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Initialize kernel source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u "$REPO_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1

      - name: Sync kernel source
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Checkout requested kernel reference
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ github.event.inputs.kernel_ref }}"

          if [ "$REF" = "android12-5.10" ]; then
            echo "Using manifest-selected kernel revision."
            exit 0
          fi

          git fetch --depth=1 origin "$REF" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            git checkout -B "$REF" "origin/$REF"
          elif git rev-parse --verify --quiet "$REF^{commit}"; then
            git checkout "$REF"
          else
            echo "::error::Kernel reference not found: $REF"
            exit 1
          fi

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_DIR"
          mkdir -p "$NEUTRON_DIR"

          cd "$NEUTRON_DIR"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman
          ./antman -S=latest

          test -d "$NEUTRON_DIR/bin"
          test -x "$NEUTRON_DIR/bin/clang-24"
          test -x "$NEUTRON_DIR/bin/lld"

          cd "$NEUTRON_DIR/bin"

          ln -sfn clang-24 clang
          ln -sfn clang-24 clang++
          ln -sfn lld ld.lld

          echo "$NEUTRON_DIR/bin" >> "$GITHUB_PATH"
          echo "NEUTRON_BIN=$NEUTRON_DIR/bin" >> "$GITHUB_ENV"

      - name: Verify Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_BIN:$PATH"

          CLANG="$(readlink -f "$(command -v clang)")"
          CLANGXX="$(readlink -f "$(command -v clang++)")"
          LLD="$(readlink -f "$(command -v ld.lld)")"

          test "$CLANG" = "$NEUTRON_BIN/clang-24"
          test "$CLANGXX" = "$NEUTRON_BIN/clang-24"
          test "$LLD" = "$NEUTRON_BIN/lld"

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          clang --version | tee \
            "$GITHUB_WORKSPACE/build-info/clang-version.txt"

          ld.lld --version | tee \
            "$GITHUB_WORKSPACE/build-info/lld-version.txt"

          llvm-ar --version | tee \
            "$GITHUB_WORKSPACE/build-info/llvm-ar-version.txt"

          clang --version

      - name: Configure kernel build
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="common/build.config.gki.aarch64"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Missing $CONFIG"
            exit 1
          fi

          # Important:
          # build.sh internally resolves this relative to the repo root.
          # Do not put /home/runner/... here.
          NEUTRON_REL="../toolchains/neutron-clang/bin"

          sed -i '/^CLANG_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM=/d' "$CONFIG"
          sed -i '/^LLVM_IAS=/d' "$CONFIG"
          sed -i '/^CC=/d' "$CONFIG"
          sed -i '/^HOSTCC=/d' "$CONFIG"
          sed -i '/^HOSTCXX=/d' "$CONFIG"
          sed -i '/^LD=/d' "$CONFIG"
          sed -i '/^AR=/d' "$CONFIG"
          sed -i '/^NM=/d' "$CONFIG"
          sed -i '/^OBJCOPY=/d' "$CONFIG"
          sed -i '/^OBJDUMP=/d' "$CONFIG"
          sed -i '/^READELF=/d' "$CONFIG"
          sed -i '/^STRIP=/d' "$CONFIG"

          cat >> "$CONFIG" <<EOF
          CLANG_PREBUILT_BIN=$NEUTRON_REL/
          LLVM_PREBUILT_BIN=$NEUTRON_REL/
          LLVM=1
          LLVM_IAS=1
          CC=clang
          HOSTCC=clang
          HOSTCXX=clang++
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          STRIP=llvm-strip
          EOF

          echo "===== Active compiler configuration ====="
          grep -E \
            'CLANG_PREBUILT_BIN|LLVM_PREBUILT_BIN|^LLVM=|^CC=|^HOSTCC=|^LD=|^AR=' \
            "$CONFIG"

      - name: Validate build.sh compiler path
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          ROOT_DIR="$PWD"
          RELATIVE_BIN="../toolchains/neutron-clang/bin"
          RESOLVED_BIN="$(readlink -f "$ROOT_DIR/$RELATIVE_BIN")"

          test "$RESOLVED_BIN" = "$NEUTRON_BIN"
          test -x "$RESOLVED_BIN/clang"
          test -x "$RESOLVED_BIN/clang-24"
          test -x "$RESOLVED_BIN/ld.lld"

          echo "ROOT_DIR=$ROOT_DIR"
          echo "RELATIVE_BIN=$RELATIVE_BIN"
          echo "RESOLVED_BIN=$RESOLVED_BIN"

          "$RESOLVED_BIN/clang" --version

      - name: Remove stale compiler metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path '*/include/generated/compile.h' \
            -type f \
            -delete || true

          find . \
            -name '.version' \
            -type f \
            -delete || true

      - name: Apply optional KernelSU
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "KernelSU-Next" ]; then
            echo "KernelSU-Next already exists."
            exit 0
          fi

          if [ -f "KernelSU-Next/kernel/setup.sh" ]; then
            bash KernelSU-Next/kernel/setup.sh
          else
            echo "KernelSU-Next setup skipped."
          fi

      - name: Apply optional SUSFS
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${{ github.event.inputs.susfs_commit }}" ]; then
            echo "SUSFS commit not supplied; skipping SUSFS."
            exit 0
          fi

          if [ ! -d susfs4ksu ]; then
            git clone \
              https://gitlab.com/simonpunk/susfs4ksu.git \
              susfs4ksu
          fi

          cd susfs4ksu
          git fetch --depth=1 origin \
            "${{ github.event.inputs.susfs_commit }}"

          git checkout "${{ github.event.inputs.susfs_commit }}"

          cd ../common

          PATCH_FILE="$(
            find ../susfs4ksu/kernel_patches \
              -maxdepth 1 \
              -name '*gki-android12-5.10*.patch' \
              -type f |
            head -n1
          )"

          if [ -z "$PATCH_FILE" ]; then
            echo "::error::SUSFS patch not found"
            exit 1
          fi

          cp ../susfs4ksu/kernel_patches/fs/* fs/ || true
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/ || true

          patch -p1 --fuzz=3 < "$PATCH_FILE"

      - name: Configure kernel options
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"

          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_WERROR=n
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ github.event.inputs.enable_performance }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=n
          EOF
          fi

          if [ "${{ github.event.inputs.enable_gaming }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_MODULE_FORCE_LOAD=y
          EOF
          fi

      - name: Build kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_BIN:$PATH"

          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export LTO=thin
          export LLVM_PARALLEL_LINK_JOBS=1
          export LLVM_PARALLEL_COMPILE_JOBS=2
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github-runner

          # Prevent absolute path from being re-used incorrectly.
          unset CLANG_PREBUILT_BIN || true
          unset LLVM_PREBUILT_BIN || true

          test "$(readlink -f "$(command -v clang)")" \
            = "$NEUTRON_BIN/clang-24"

          test "$(readlink -f "$(command -v ld.lld)")" \
            = "$NEUTRON_BIN/lld"

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          LTO=thin \
          build/build.sh -j2

      - name: Verify generated compiler metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_H="$(
            find out \
              -path '*/include/generated/compile.h' \
              -type f |
            head -n1
          )"

          if [ -z "$COMPILE_H" ] || [ ! -f "$COMPILE_H" ]; then
            echo "::error::include/generated/compile.h was not generated"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$COMPILE_H" \
            "$GITHUB_WORKSPACE/build-info/compile.h"

          cat "$COMPILE_H"

          if grep -qiE \
            'clang version 12|clang version 11|clang version 10' \
            "$COMPILE_H"; then
            echo "::error::Old compiler metadata detected"
            exit 1
          fi

          grep -E \
            'LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST' \
            "$COMPILE_H" \
            > "$GITHUB_WORKSPACE/build-info/compiler-proof.txt" || true

      - name: Locate final Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find out \
              -path '*/dist/Image' \
              -type f |
            head -n1
          )"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(
              find out \
                -name Image \
                -type f |
              head -n1
            )"
          fi

          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::Final Image not found"
            find out -maxdepth 6 -type f | sort || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$IMAGE" \
            "$GITHUB_WORKSPACE/build-info/Image"

          sha256sum "$IMAGE" | tee \
            "$GITHUB_WORKSPACE/build-info/Image.sha256"

          echo "IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/$IMAGE" \
            >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            AnyKernel3

          cp "$IMAGE_PATH" AnyKernel3/Image

          SOURCE_HASH="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
          PACKAGE_HASH="$(sha256sum AnyKernel3/Image | awk '{print $1}')"

          test "$SOURCE_HASH" = "$PACKAGE_HASH"

          cd AnyKernel3

          ZIP_NAME="${{ github.event.inputs.device_name }}-NeutronClang24.zip"

          zip -r9 -q "../$ZIP_NAME" . -x ".git*" "*.zip"

          cd ..

          sha256sum "$ZIP_NAME" \
            > "build-info/$ZIP_NAME.sha256"

      - name: Print build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Build summary ====="
          echo "Device: ${{ github.event.inputs.device_name }}"
          echo "Kernel ref: ${{ github.event.inputs.kernel_ref }}"
          echo "Compiler: Neutron Clang 24"
          echo "LTO: thin"
          echo "Image: $IMAGE_PATH"

          ccache --show-stats || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-NeutronClang24
          path: |
            *.zip
            build-info/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            kernel_workspace/out/**/*.log
            kernel_workspace/out/**/compile.h
            build-info/**
          if-no-files-found: ignore
          retention-days: 7
