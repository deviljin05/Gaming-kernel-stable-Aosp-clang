name: Build Android 12 GKI - Hybrid Neutron Clang

"on":
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "lts or exact GKI tag"
        required: true
        default: "android12-5.10.264_r00"
        type: string

      susfs_commit:
        description: "Optional SUSFS commit hash"
        required: false
        default: ""
        type: string

      device_name:
        description: "Artifact/device label"
        required: false
        default: "gki-custom"
        type: string

      compiler_release:
        description: "Neutron Clang release or latest"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

env:
  VERSION: android12-5.10
  TOOLCHAIN_DIR: /home/runner/toolchains/neutron-clang
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build GKI Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    container:
      image: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm

          pacman -S --noconfirm --needed \
            base-devel \
            clang \
            llvm \
            lld \
            gcc \
            git \
            curl \
            wget \
            rsync \
            bc \
            bison \
            flex \
            openssl \
            python \
            ncurses \
            ccache \
            zip \
            unzip \
            dtc \
            patchelf \
            file \
            perl \
            pahole \
            libxml2 \
            python-setuptools \
            inetutils

          command -v bash
          command -v git
          command -v curl
          command -v python3
          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Prepare ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --zero-stats
          ccache --version

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$TOOLCHAIN_DIR"
          cd "$TOOLCHAIN_DIR"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman

          RELEASE="${{ inputs.compiler_release }}"

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "latest" ]; then
            ./antman -S=latest
          else
            ./antman -S="$RELEASE"
          fi

          test -x "$TOOLCHAIN_DIR/bin/clang"
          test -x "$TOOLCHAIN_DIR/bin/clang++"
          test -x "$TOOLCHAIN_DIR/bin/ld.lld"
          test -x "$TOOLCHAIN_DIR/bin/llvm-ar"
          test -x "$TOOLCHAIN_DIR/bin/llvm-nm"
          test -x "$TOOLCHAIN_DIR/bin/llvm-objcopy"
          test -x "$TOOLCHAIN_DIR/bin/llvm-objdump"
          test -x "$TOOLCHAIN_DIR/bin/llvm-readelf"
          test -x "$TOOLCHAIN_DIR/bin/llvm-strip"

          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron toolchain
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_BIN="$TOOLCHAIN_DIR/bin"

          "$TOOLCHAIN_BIN/clang" --version
          "$TOOLCHAIN_BIN/clang++" --version
          "$TOOLCHAIN_BIN/ld.lld" --version

          cat > /tmp/neutron-test.c <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              puts("neutron-clang-host-test-ok");
              return 0;
          }
          EOF

          "$TOOLCHAIN_BIN/clang" \
            -O2 \
            -fno-lto \
            -fno-pie \
            -no-pie \
            /tmp/neutron-test.c \
            -o /tmp/neutron-test

          /tmp/neutron-test

      - name: Resolve manifest
        shell: bash
        run: |
          set -euo pipefail

          INPUT="${{ inputs.os_patch_level }}"

          if [ "$INPUT" = "lts" ]; then
            echo "MANIFEST_REF=common-${VERSION}-lts" >> "$GITHUB_ENV"
            echo "PIN_TYPE=" >> "$GITHUB_ENV"
            echo "PIN_REF=" >> "$GITHUB_ENV"

          elif [[ "$INPUT" =~ ^android12-5.10.[0-9]+_r[0-9]+$ ]]; then
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=tag" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"

          else
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=branch" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
          fi

      - name: Initialize kernel manifest
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

      - name: Sync kernel sources
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Pin common kernel
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REMOTE="$(git remote | head -n1)"

          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/tags/$PIN_REF:refs/tags/$PIN_REF"

            git checkout "refs/tags/$PIN_REF"
          else
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/heads/$PIN_REF:refs/remotes/$REMOTE/$PIN_REF"

            git checkout -B \
              "$PIN_REF" \
              "refs/remotes/$REMOTE/$PIN_REF"
          fi

      - name: Read kernel sublevel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          SUBLEVEL_VALUE="$(
            awk -F '= ' '/^SUBLEVEL = / {print $2; exit}' common/Makefile
          )"

          test -n "$SUBLEVEL_VALUE"

          echo "SUBLEVEL=$SUBLEVEL_VALUE" >> "$GITHUB_ENV"
          echo "Detected kernel sublevel: $SUBLEVEL_VALUE"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          SUSFS_INPUT="${{ inputs.susfs_commit }}"

          if [ -n "$SUSFS_INPUT" ]; then
            git fetch --depth=1 origin "$SUSFS_INPUT"
            git checkout "$SUSFS_INPUT"
          fi

          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SUSFS
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          test -f "$CONFIG"

          cat >> "$CONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Copy SUSFS files
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          cp \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            ./50_add_susfs_in_gki-android12-5.10.patch

          test -f 50_add_susfs_in_gki-android12-5.10.patch

      - name: Prepare compatibility fixes
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 43 ]; then
            sed -i \
              's/int[[:space:]]+this_len[[:space:]]*=[[:space:]]*min_t(size_t,/size_t this_len = min_t(size_t,/' \
              fs/proc/base.c || true
          fi

          if [ "$SUBLEVEL" -le 117 ]; then
            sed -i \
              's/mask,[[:space:]]*mark->ignored_mask/inotify_mark_user_mask(mark)/g' \
              fs/notify/fdinfo.c || true

            sed -i \
              's/ignored_mask:%x/ignored_mask:0/g' \
              fs/notify/fdinfo.c || true
          fi

          if [ "$SUBLEVEL" -le 209 ]; then
            sed -i \
              's/goto show_pad;/return 0;/g' \
              fs/proc/task_mmu.c || true
          fi

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          PATCH_FILE="50_add_susfs_in_gki-android12-5.10.patch"

          if git apply --check --whitespace=nowarn "$PATCH_FILE" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH_FILE"
          else
            echo "SUSFS patch is already applied or is not cleanly applicable."
            echo "Continuing because SUSFS source files are already present."
          fi

      - name: Fix SUSFS nameidata
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c || true

      - name: Install KernelSU Next
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

          test -d KernelSU-Next

      - name: Apply KernelSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch

          if git apply --check static.patch 2>/dev/null; then
            git apply static.patch
          else
            echo "KernelSU static patch already applied or skipped."
          fi

      - name: Apply BBRv3
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/wildpatches

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          BBR_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_NAME="bbr"
          BBR_APPLIED="false"

          if [ -f "$BBR_PATCH" ]; then
            if git apply --check "$BBR_PATCH" 2>/dev/null; then
              git apply "$BBR_PATCH"
              BBR_APPLIED="true"
            else
              echo "BBRv3 patch already applied or skipped."
            fi
          fi

          echo "BBR_NAME=$BBR_NAME" >> "$GITHUB_ENV"
          echo "BBR_APPLIED=$BBR_APPLIED" >> "$GITHUB_ENV"

      - name: Apply NTSync
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 208 ]; then
            curl -fsSL \
              -o /tmp/ntsync-lockdep.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch

            if git apply --check /tmp/ntsync-lockdep.patch 2>/dev/null; then
              git apply /tmp/ntsync-lockdep.patch
            else
              echo "NTSync lockdep patch already applied or skipped."
            fi
          fi

          curl -fsSL \
            -o /tmp/ntsync-compat.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          if git apply --check /tmp/ntsync-compat.patch 2>/dev/null; then
            git apply /tmp/ntsync-compat.patch
          else
            echo "NTSync compatibility patch already applied or skipped."
          fi

          curl -fsSL \
            -o /tmp/ntsync-base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch

          if git apply --check /tmp/ntsync-base.patch 2>/dev/null; then
            git apply /tmp/ntsync-base.patch
          else
            echo "NTSync base patch already applied or skipped."
          fi

      - name: Apply Droidspaces
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          DROIDSPACES_KABI_OK="true"

          curl -fsSL \
            -o /tmp/droidspaces-sysvipc.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          if git apply --check /tmp/droidspaces-sysvipc.patch 2>/dev/null; then
            git apply /tmp/droidspaces-sysvipc.patch
          else
            echo "Droidspaces SYSVIPC patch already applied or skipped."
          fi

          curl -fsSL \
            -o /tmp/droidspaces-mqueue.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch

          if git apply --check /tmp/droidspaces-mqueue.patch 2>/dev/null; then
            git apply /tmp/droidspaces-mqueue.patch
          else
            echo "Droidspaces POSIX mqueue patch already applied or skipped."
          fi

          echo "DROIDSPACES_KABI_OK=$DROIDSPACES_KABI_OK" >> "$GITHUB_ENV"

      - name: Configure kernel features
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          cat >> "$CONFIG" <<EOF
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_TCP_CONG=$BBR_NAME
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          CONFIG_NTSYNC=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_TARGET_REJECT=y
          CONFIG_NETFILTER_XT_TARGET_LOG=y
          CONFIG_NETFILTER_XT_MATCH_RECENT=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_NET=y
          CONFIG_NETFILTER_XT_SET=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XA
