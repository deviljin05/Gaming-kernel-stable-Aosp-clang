name: Build Custom GKI Kernel (Neutron Clang + SUSFS + BBRv3)

on:
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "'lts' = rolling LTS branch. Or pin an exact GKI release tag like android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
        type: string
      susfs_commit:
        description: "SUSFS commit hash (leave empty = latest on gki-android12-5.10 branch)"
        required: false
        default: ""
        type: string
      device_name:
        description: "Artifact label"
        required: false
        default: "gki-custom"
        type: string
      compiler_release:
        description: "Neutron release tag or latest"
        required: false
        default: "latest"
        type: string
      enable_gaming_perf_tune:
        description: "Enable gaming/latency perf tweaks"
        required: true
        default: "false"
        type: string
      enable_performance_governor:
        description: "Force performance governor"
        required: true
        default: "false"
        type: string

permissions:
  contents: read

env:
  VERSION: android12-5.10
  CCACHE_DIR: /home/runner/.ccache
  NEUTRON_HOME: ${{ github.workspace }}/kernel_workspace/neutron-clang
  TOOLCHAIN_BIN: ${{ github.workspace }}/kernel_workspace/neutron-clang/bin
  BUILD_USER: Neutron
  BUILD_HOST: clang

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl bc bison flex libssl-dev \
            build-essential python3 python3-pip libncurses-dev \
            ccache zip unzip device-tree-compiler \
            lld llvm patchelf coreutils findutils

      - name: Install repo tool
        run: |
          set -euo pipefail
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up ccache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"

      - name: Download Neutron Clang
        run: |
          set -euo pipefail
          rm -rf "$NEUTRON_HOME"
          mkdir -p "$NEUTRON_HOME"
          cd "$NEUTRON_HOME"
          curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
          chmod +x antman
          RELEASE="${{ inputs.compiler_release }}"
          if [ -z "${RELEASE}" ] || [ "${RELEASE}" = "latest" ]; then
            ./antman -S
          else
            ./antman -S="${RELEASE}"
          fi
          if ! "$TOOLCHAIN_BIN/clang" --version >/dev/null 2>&1; then
            ./antman --patch=glibc
          fi
          cd "$TOOLCHAIN_BIN"
          if [ ! -x clang ]; then
            CLANG_BIN="$(find . -maxdepth 1 -type f -name 'clang-*' ! -name '*++*' -perm -u+x | sort -V | tail -n1 | sed 's#^\./##')"
            [ -n "${CLANG_BIN}" ] && ln -sf "${CLANG_BIN}" clang
          fi
          if [ ! -x clang++ ]; then
            CLANGPP_BIN="$(find . -maxdepth 1 -type f -name 'clang++-*' -perm -u+x | sort -V | tail -n1 | sed 's#^\./##')"
            if [ -n "${CLANGPP_BIN}" ]; then
              ln -sf "${CLANGPP_BIN}" clang++
            elif [ -x clang ]; then
              ln -sf clang clang++
            fi
          fi
          if [ ! -x ld.lld ] && [ -x lld ]; then
            ln -sf lld ld.lld
          fi
          cd "$NEUTRON_HOME"
          test -x "$TOOLCHAIN_BIN/clang"
          test -x "$TOOLCHAIN_BIN/clang++"
          test -x "$TOOLCHAIN_BIN/ld.lld"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

      - name: Verify Neutron clang
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$PATH"
          command -v clang
          clang --version
          clang++ --version
          ld.lld --version

      - name: Resolve manifest ref
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.os_patch_level }}"
          if [ "${INPUT}" = "lts" ]; then
            MANIFEST_REF="common-${VERSION}-lts"
            PIN_REF=""
            PIN_TYPE=""
          elif [[ "${INPUT}" =~ ^${VERSION}\.[0-9]+_r[0-9]+$ ]]; then
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="tag"
          else
            MANIFEST_REF="common-${VERSION}"
            PIN_REF="${INPUT}"
            PIN_TYPE="branch"
          fi
          echo "MANIFEST_REF=${MANIFEST_REF}" >> "$GITHUB_ENV"
          echo "PIN_REF=${PIN_REF}" >> "$GITHUB_ENV"
          echo "PIN_TYPE=${PIN_TYPE}" >> "$GITHUB_ENV"

      - name: Sync source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://android.googlesource.com/kernel/manifest -b "${MANIFEST_REF}" --depth=1
          repo sync -c --current-branch --no-clone-bundle --no-tags -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Pin exact source
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          REMOTE_NAME="$(git remote | head -n1)"
          if [ "${PIN_TYPE}" = "tag" ]; then
            git fetch --depth=1 "${REMOTE_NAME}" "refs/tags/${PIN_REF}:refs/tags/${PIN_REF}"
            git checkout "refs/tags/${PIN_REF}"
          else
            git fetch --depth=1 "${REMOTE_NAME}" "refs/heads/${PIN_REF}:refs/remotes/${REMOTE_NAME}/${PIN_REF}"
            git checkout -B "${PIN_REF}" "refs/remotes/${REMOTE_NAME}/${PIN_REF}"
          fi

      - name: Clean out dir
        run: |
          set -euo pipefail
          rm -rf kernel_workspace/out || true

      - name: Detect sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SUBLEVEL="$(grep -m1 '^SUBLEVEL = ' common/Makefile | awk '{print $3}')"
          echo "SUBLEVEL=${SUBLEVEL}" >> "$GITHUB_ENV"

      - name: Clone SUSFS4KSU
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
          cd susfs4ksu
          if [ -n "${{ github.event.inputs.susfs_commit }}" ]; then
            git checkout "${{ github.event.inputs.susfs_commit }}"
          fi
          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Force build config to Neutron clang
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          for f in build.config.common build.config.gki build.config.gki.aarch64; do
            [ -f "$f" ] || continue
            if grep -q '^CLANG_PREBUILT_BIN=' "$f"; then
              sed -i 's#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=neutron-clang/bin#' "$f"
            else
              printf '%s\n' 'CLANG_PREBUILT_BIN=neutron-clang/bin' >> "$f"
            fi
          done
          grep -q '^LLVM=1' build.config.common 2>/dev/null || printf '%s\n' 'LLVM=1' >> build.config.common

      - name: Force local version control
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          printf '%s\n' '-NEUTRON' > .scmversion
          if [ -f scripts/setlocalversion ]; then
            cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf '%s' '-NEUTRON'
          EOF
            chmod +x scripts/setlocalversion
          fi
          if ! grep -q '^CONFIG_LOCALVERSION_AUTO=n' arch/arm64/configs/gki_defconfig; then
            printf '%s\n' 'CONFIG_LOCALVERSION_AUTO=n' >> arch/arm64/configs/gki_defconfig
          fi
          if ! grep -q '^CONFIG_LOCALVERSION="-NEUTRON"' arch/arm64/configs/gki_defconfig; then
            printf '%s\n' 'CONFIG_LOCALVERSION="-NEUTRON"' >> arch/arm64/configs/gki_defconfig
          fi

      - name: Set SUSFS configs
        run: |
          set -euo pipefail
          cd kernel_workspace/common/arch/arm64/configs
          {
            printf '%s\n' 'CONFIG_KSU=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SUS_PATH=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SUS_MOUNT=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SUS_KSTAT=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SPOOF_UNAME=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_ENABLE_LOG=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_OPEN_REDIRECT=y'
            printf '%s\n' 'CONFIG_KSU_SUSFS_SUS_MAP=y'
          } >> gki_defconfig

      - name: Copy SUSFS kernel patches
        run: |
          set -euo pipefail
          cd kernel_workspace/common
          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch ./

      - name: Apply compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            perl -i -pe 's/(int|size_t)\s+this_len\s*=\s*min_t\s*\(\s*\1\s*,/size_t this_len = min_t(size_t,/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            sed -i '/^[[:space:]]*\/\*$/,/^[[:space:]]*u32 mask = mark->mask & IN_ALL_EVENTS;$/d' fs/notify/fdinfo.c
            perl -i -pe 's/\bmask,\s*mark->ignored_mask/inotify_mark_user_mask(mark)/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:%x/ignored_mask:0/g' fs/notify/fdinfo.c
          fi

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          patch -p1 --fuzz=3 < 50_add_susfs_in_gki-android12-5.10.patch

      - name: Fix SUSFS mismatch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          sed -i 's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' fs/namei.c

      - name: Revert compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "43" ]; then
            sed -i 's/^size_t this_len = min_t(size_t, count, PAGE_SIZE);$/int this_len = min_t(int, count, PAGE_SIZE);/' fs/proc/base.c
          fi
          if [ "${SUBLEVEL}" -le "117" ]; then
            perl -i -pe 's#^(\s+if \(inode\) \{)#$1\n\t\t/*\n\t\t * IN_ALL_EVENTS represents all of the mask bits\n\t\t * that we expose to userspace.\n\t\t *\/\n\t\tu32 mask = mark->mask \& IN_ALL_EVENTS;#m' fs/notify/fdinfo.c
            perl -i -pe 's/\binotify_mark_user_mask\(mark\)/mask, mark->ignored_mask/g' fs/notify/fdinfo.c
            perl -i -pe 's/ignored_mask:0/ignored_mask:%x/g' fs/notify/fdinfo.c
          fi

      - name: Apply show_pad fix
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "209" ]; then
            sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
          fi

      - name: Setup KernelSU-Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

      - name: Fix KernelSU-Next static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail
          curl -fsSL -o static.patch https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch
          patch -p1 --forward < static.patch || true

      - name: Apply BBRv3 backport
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wildpatches
          BBRV3_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_CONG_NAME="bbr"
          BBRV3_PATCH_APPLIED="false"
          if [ -f "$BBRV3_PATCH" ] && patch -p1 < "$BBRV3_PATCH"; then
            BBRV3_PATCH_APPLIED="true"
            DETECTED="$(grep -rhoE '\.name\s*=\s*"[a-zA-Z0-9_]+"' net/ipv4/tcp_bbr*.c 2>/dev/null | grep -oE '"[a-zA-Z0-9_]+"' | tr -d '"' | head -n1 || true)"
            [ -n "$DETECTED" ] && BBR_CONG_NAME="$DETECTED"
          fi
          echo "BBR_CONG_NAME=${BBR_CONG_NAME}" >> "$GITHUB_ENV"
          echo "BBRV3_PATCH_APPLIED=${BBRV3_PATCH_APPLIED}" >> "$GITHUB_ENV"

      - name: Set TCP configs
        run: |
          set -euo pipefail
          cd kernel_workspace/common/arch/arm64/configs
          {
            printf '%s\n' 'CONFIG_TCP_CONG_ADVANCED=y'
            printf '%s\n' 'CONFIG_TCP_CONG_BBR=y'
            printf '%s\n' 'CONFIG_TCP_CONG_CUBIC=y'
            printf '%s\n' 'CONFIG_TCP_CONG_BIC=y'
            printf '%s\n' 'CONFIG_TCP_CONG_WESTWOOD=y'
            printf '%s\n' 'CONFIG_TCP_CONG_HTCP=y'
            if [ "${BBRV3_PATCH_APPLIED}" = "true" ]; then
              printf '%s\n' 'CONFIG_TCP_CONG_BBR3=y'
            fi
            printf '%s\n' "CONFIG_DEFAULT_TCP_CONG=${BBR_CONG_NAME}"
            printf '%s\n' 'CONFIG_NET_SCH_FQ=y'
            printf '%s\n' 'CONFIG_NET_SCH_FQ_CODEL=y'
            printf '%s\n' 'CONFIG_NET_SCH_CAKE=y'
          } >> gki_defconfig

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "208" ]; then
            curl -fsSL -o /tmp/0003-lockdep-assert-none-held.patch https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || true
          fi
          curl -fsSL -o /tmp/ntsync_compat_android12-5.10.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || true
          curl -fsSL -o /tmp/ntsync_base.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || true
          printf '%s\n' 'CONFIG_NTSYNC=y' >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces kABI-safe patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          DROIDSPACES_KABI_OK="true"
          curl -fsSL -o /tmp/droidspaces_sysvipc_kabi.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          if ! patch -p1 < /tmp/droidspaces_sysvipc_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          curl -fsSL -o /tmp/droidspaces_posix_mqueue_kabi.patch https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
          if ! patch -p1 < /tmp/droidspaces_posix_mqueue_kabi.patch; then
            DROIDSPACES_KABI_OK="false"
          fi
          echo "DROIDSPACES_KABI_OK=${DROIDSPACES_KABI_OK}" >> "$GITHUB_ENV"

      - name: Set Droidspaces configs
        run: |
          set -euo pipefail
          cd kernel_workspace/common/arch/arm64/configs
          if [ "${DROIDSPACES_KABI_OK}" = "true" ]; then
            {
              printf '%s\n' 'CONFIG_SYSVIPC=y'
              printf '%s\n' 'CONFIG_POSIX_MQUEUE=y'
              printf '%s\n' 'CONFIG_IPC_NS=y'
            } >> gki_defconfig
          fi
          {
            printf '%s\n' 'CONFIG_NAMESPACES=y'
            printf '%s\n' 'CONFIG_NET_NS=y'
            printf '%s\n' 'CONFIG_CGROUPS=y'
            printf '%s\n' 'CONFIG_PID_NS=y'
            printf '%s\n' 'CONFIG_USER_NS=y'
            printf '%s\n' 'CONFIG_DEVTMPFS=y'
            printf '%s\n' 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
            printf '%s\n' 'CONFIG_NETFILTER_XT_TARGET_REJECT=y'
            printf '%s\n' 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
            printf '%s\n' 'CONFIG_NETFILTER_XT_MATCH_RECENT=y'
            printf '%s\n' 'CONFIG_IP_SET=y'
            printf '%s\n' 'CONFIG_IP_SET_HASH_IP=y'
            printf '%s\n' 'CONFIG_IP_SET_HASH_NET=y'
            printf '%s\n' 'CONFIG_NETFILTER_XT_SET=y'
            printf '%s\n' 'CONFIG_TMPFS_POSIX_ACL=y'
            printf '%s\n' 'CONFIG_TMPFS_XATTR=y'
            printf '%s\n' 'CONFIG_LOCALVERSION_AUTO=n'
          } >> gki_defconfig

      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          sed -i 's/check_defconfig//' ./common/build.config.gki || true

      - name: Disable strict modules verification
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          grep -rl '^MODULES_ORDER=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_ORDER=.*/MODULES_ORDER=/' || true
          grep -rl '^MODULES_LIST=' build.config* 2>/dev/null | xargs -r sed -i 's/^MODULES_LIST=.*/MODULES_LIST=/' || true

      - name: Build kernel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$PATH"
          export CC="$TOOLCHAIN_BIN/clang"
          export CXX="$TOOLCHAIN_BIN/clang++"
          export HOSTCC="$TOOLCHAIN_BIN/clang"
          export HOSTCXX="$TOOLCHAIN_BIN/clang++"
          export LD="$TOOLCHAIN_BIN/ld.lld"
          export AR="$TOOLCHAIN_BIN/llvm-ar"
          export NM="$TOOLCHAIN_BIN/llvm-nm"
          export OBJCOPY="$TOOLCHAIN_BIN/llvm-objcopy"
          export OBJDUMP="$TOOLCHAIN_BIN/llvm-objdump"
          export READELF="$TOOLCHAIN_BIN/llvm-readelf"
          export STRIP="$TOOLCHAIN_BIN/llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER="${BUILD_USER}"
          export KBUILD_BUILD_HOST="${BUILD_HOST}"
          export KBUILD_BUILD_VERSION=1
          export LOCALVERSION=
          export CLANG_PREBUILT_BIN=neutron-clang/bin
          rm -rf out
          NPROC="$(getconf _NPROCESSORS_ONLN || echo 2)"
          BUILD_CONFIG=common/build.config.gki.aarch64 USE_CCACHE=1 CCACHE_DIR="${CCACHE_DIR}" build/build.sh -j"${NPROC}"

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG="$(find out -path "*dist/Image" | head -n1)"
          if [ -z "$IMG" ]; then
            IMG="$(find out -name "Image" | head -n1)"
          fi
          [ -n "$IMG" ]
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "../${{ github.event.inputs.device_name }}-Neutron-android12-5.10-susfs${SUSFS_COMMIT:0:8}.zip" . -x ".git*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: "*.zip"
          retention-days: 14
