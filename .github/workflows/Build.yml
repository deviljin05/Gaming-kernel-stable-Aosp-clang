name: Build Android 12 GKI Kernel

"on":
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Exact GKI tag, for example android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
        type: string

      susfs_commit:
        description: "Optional SUSFS commit hash"
        required: false
        default: ""
        type: string

      device_name:
        description: "Artifact/device label"
        required: false
        default: "gki-custom"
        type: string

      compiler_release:
        description: "Neutron Clang release or latest"
        required: false
        default: "latest"
        type: string

      enable_extra_patches:
        description: "Enable experimental BBRv3 and NTSync patches"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERSION: android12-5.10
  TOOLCHAIN_DIR: ${{ github.workspace }}/toolchains/neutron-clang
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build GKI Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          df -h

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            clang \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

          command -v bash
          command -v git
          command -v curl
          command -v python3
          command -v clang
          command -v ld.lld
          command -v aarch64-linux-gnu-gcc

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install repo tool
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL --retry 5 --retry-delay 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Prepare ccache
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --zero-stats

      - name: Install Neutron Clang
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains/neutron-clang"

          mkdir -p "$TOOLCHAIN_DIR"
          cd "$TOOLCHAIN_DIR"

          curl -fL --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          test -s antman
          chmod +x antman

          RELEASE="${{ inputs.compiler_release }}"

          if [ -z "$RELEASE" ] || [ "$RELEASE" = "latest" ]; then
            ./antman -S latest
          else
            ./antman -S "$RELEASE"
          fi

          echo "Searching for installed Neutron Clang binaries..."

          CLANG_PATH="$(find "$TOOLCHAIN_DIR" -type f -name clang -perm -111 | head -n1 || true)"
          CLANGXX_PATH="$(find "$TOOLCHAIN_DIR" -type f -name clang++ -perm -111 | head -n1 || true)"
          LLD_PATH="$(find "$TOOLCHAIN_DIR" -type f -name ld.lld -perm -111 | head -n1 || true)"

          if [ -z "$CLANG_PATH" ] || [ -z "$CLANGXX_PATH" ] || [ -z "$LLD_PATH" ]; then
            echo "ERROR: Neutron Clang binaries were not found."
            echo "Toolchain contents:"
            find "$TOOLCHAIN_DIR" -maxdepth 6 -type f | sort | head -n 300
            exit 1
          fi

          TOOLCHAIN_BIN="$(dirname "$CLANG_PATH")"

          echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo "Neutron Clang directory: $TOOLCHAIN_BIN"
          echo "clang: $CLANG_PATH"
          echo "clang++: $CLANGXX_PATH"
          echo "ld.lld: $LLD_PATH"

      - name: Verify Neutron Clang
        run: |
          set -euo pipefail

          test -n "${TOOLCHAIN_BIN:-}"
          test -x "$TOOLCHAIN_BIN/clang"
          test -x "$TOOLCHAIN_BIN/clang++"
          test -x "$TOOLCHAIN_BIN/ld.lld"

          "$TOOLCHAIN_BIN/clang" --version
          "$TOOLCHAIN_BIN/clang++" --version
          "$TOOLCHAIN_BIN/ld.lld" --version

          cat > "$RUNNER_TEMP/neutron-test.c" <<'EOF'
          #include <stdio.h>

          int main(void)
          {
              puts("neutron-clang-test-ok");
              return 0;
          }
          EOF

          "$TOOLCHAIN_BIN/clang" \
            -O2 \
            -fno-lto \
            -fno-pie \
            -no-pie \
            "$RUNNER_TEMP/neutron-test.c" \
            -o "$RUNNER_TEMP/neutron-test"

          "$RUNNER_TEMP/neutron-test"

          echo "Neutron Clang verification successful."

      - name: Resolve manifest
        run: |
          set -euo pipefail

          INPUT="${{ inputs.os_patch_level }}"

          if [ "$INPUT" = "lts" ]; then
            echo "MANIFEST_REF=common-${VERSION}-lts" >> "$GITHUB_ENV"
            echo "PIN_TYPE=" >> "$GITHUB_ENV"
            echo "PIN_REF=" >> "$GITHUB_ENV"

          elif [[ "$INPUT" =~ ^android12-5.10.[0-9]+_r[0-9]+$ ]]; then
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=tag" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"

          else
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=branch" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
          fi

          echo "Manifest: $MANIFEST_REF"

      - name: Initialize kernel manifest
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

      - name: Sync kernel sources
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Pin common kernel
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          REMOTE="$(git remote | head -n1)"

          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/tags/$PIN_REF:refs/tags/$PIN_REF"

            git checkout "refs/tags/$PIN_REF"
          else
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/heads/$PIN_REF:refs/remotes/$REMOTE/$PIN_REF"

            git checkout -B \
              "$PIN_REF" \
              "refs/remotes/$REMOTE/$PIN_REF"
          fi

          git describe --always --dirty

      - name: Read kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          SUBLEVEL_VALUE="$(
            awk -F '= ' '/^SUBLEVEL = / {print $2; exit}' common/Makefile
          )"

          test -n "$SUBLEVEL_VALUE"

          echo "SUBLEVEL=$SUBLEVEL_VALUE" >> "$GITHUB_ENV"
          echo "Kernel sublevel: $SUBLEVEL_VALUE"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          cd susfs4ksu

          SUSFS_INPUT="${{ inputs.susfs_commit }}"

          if [ -n "$SUSFS_INPUT" ]; then
            git fetch --depth=1 origin "$SUSFS_INPUT"
            git checkout "$SUSFS_INPUT"
          fi

          echo "SUSFS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure SUSFS
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          test -f "$CONFIG"

          cat >> "$CONFIG" <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      - name: Copy SUSFS files
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/

          cp \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            ./50_add_susfs_in_gki-android12-5.10.patch

          test -f 50_add_susfs_in_gki-android12-5.10.patch

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          PATCH_FILE="50_add_susfs_in_gki-android12-5.10.patch"

          if git apply --check --whitespace=nowarn "$PATCH_FILE" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH_FILE"
          else
            echo "SUSFS patch already applied or not cleanly applicable."
          fi

      - name: Fix SUSFS nameidata
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c || true

      - name: Install KernelSU Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

          test -d KernelSU-Next

      - name: Apply KernelSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail

          curl -fsSL \
            -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch

          if git apply --check static.patch 2>/dev/null; then
            git apply static.patch
          else
            echo "KernelSU static patch already applied or skipped."
          fi

      - name: Configure kernel features
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          cat >> "$CONFIG" <<'EOF'
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_TCP_CONG=bbr
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_NTSYNC=y
          EOF

      - name: Apply optional extra patches
        if: ${{ inputs.enable_extra_patches == true }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          BBR_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"

          if [ -f "$BBR_PATCH" ] && git apply --check "$BBR_PATCH" 2>/dev/null; then
            git apply "$BBR_PATCH"
            echo "CONFIG_TCP_CONG_BBR3=y" \
              >> arch/arm64/configs/gki_defconfig
          fi

          curl -fsSL \
            -o /tmp/ntsync.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          if git apply --check /tmp/ntsync.patch 2>/dev/null; then
            git apply /tmp/ntsync.patch
          fi

      - name: Set kernel brand
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ -f scripts/setlocalversion ]; then
            cp scripts/setlocalversion scripts/setlocalversion.original
          fi

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh
          printf -- '-BLAZE-KSUNv1-NeutronClang'
          EOF

          chmod +x scripts/setlocalversion

          echo 'CONFIG_LOCALVERSION="-NeutronClang"' \
            >> arch/arm64/configs/gki_defconfig

      - name: Disable check_defconfig
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          test -f common/build.config.gki
          sed -i 's/check_defconfig//g' common/build.config.gki

      - name: Build kernel with Neutron Clang
        working-directory: kernel_workspace
        run: |
          set -euxo pipefail

          test -n "${TOOLCHAIN_BIN:-}"
          test -x "$TOOLCHAIN_BIN/clang"
          test -x "$TOOLCHAIN_BIN/clang++"
          test -x "$TOOLCHAIN_BIN/ld.lld"

          export PATH="$TOOLCHAIN_BIN:$PATH"

          export LLVM=1
          export LLVM_IAS=1

          export CC="$TOOLCHAIN_BIN/clang"
          export CXX="$TOOLCHAIN_BIN/clang++"
          export LD="$TOOLCHAIN_BIN/ld.lld"
          export AR="$TOOLCHAIN_BIN/llvm-ar"
          export NM="$TOOLCHAIN_BIN/llvm-nm"
          export OBJCOPY="$TOOLCHAIN_BIN/llvm-objcopy"
          export OBJDUMP="$TOOLCHAIN_BIN/llvm-objdump"
          export READELF="$TOOLCHAIN_BIN/llvm-readelf"
          export STRIP="$TOOLCHAIN_BIN/llvm-strip"

          export HOSTCC="$TOOLCHAIN_BIN/clang"
          export HOSTCXX="$TOOLCHAIN_BIN/clang++"
          export HOSTLD="$TOOLCHAIN_BIN/ld.lld"
          export HOSTAR="$TOOLCHAIN_BIN/llvm-ar"
          export HOSTNM="$TOOLCHAIN_BIN/llvm-nm"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LTO=thin
          export USE_CCACHE=1
          export CCACHE_DIR="$CCACHE_DIR"

          rm -rf out
          mkdir -p out

          "$CC" --version | head -n3
          "$HOSTCC" --version | head -n3
          "$LD" --version | head -n2

          make -C common \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTCC="$HOSTCC" \
            HOSTCXX="$HOSTCXX" \
            HOSTLD="$HOSTLD" \
            HOSTAR="$HOSTAR" \
            HOSTNM="$HOSTNM" \
            HOSTCFLAGS="-O2 -fno-lto -fno-pie -no-pie" \
            scripts/basic/fixdep

          test -x out/scripts/basic/fixdep

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          LTO=thin \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          build/build.sh \
            -j2 \
            V=1 \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CC="$CC" \
            CXX="$CXX" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            O
