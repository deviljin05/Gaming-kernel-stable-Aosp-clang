name: Build GKI Kernel - Neutron Clang

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Android kernel manifest branch"
        required: true
        default: "common-android12-5.10"

      kernel_ref:
        description: "Optional common kernel tag/branch"
        required: false
        default: ""

      device_name:
        description: "Device/kernel artifact name"
        required: true
        default: "Gaming-Kernel"

      kernel_brand:
        description: "Kernel name shown in kernel manager"
        required: true
        default: "Gaming-Kernel-NeutronClang"

      enable_performance:
        description: "Enable performance governor"
        required: true
        default: "false"

      enable_gaming:
        description: "Enable gaming options"
        required: true
        default: "false"

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  REPO_URL: https://gerrit.googlesource.com/git-repo
  NEUTRON_HOME: /home/runner/toolchains/neutron-clang
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build GKI kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize kernel source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u "$MANIFEST_URL" \
            -b "${{ github.event.inputs.kernel_branch }}" \
            --repo-url="$REPO_URL" \
            --repo-rev=main \
            --no-repo-verify \
            --depth=1

      - name: Sync kernel source
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Checkout optional kernel reference
        if: ${{ github.event.inputs.kernel_ref != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ github.event.inputs.kernel_ref }}"

          git fetch --depth=1 origin "$REF" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            git checkout -B "$REF" "origin/$REF"
          elif git rev-parse --verify --quiet "$REF^{commit}"; then
            git checkout "$REF"
          else
            echo "::error::Kernel ref not found: $REF"
            exit 1
          fi

      - name: Setup ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_HOME"
          mkdir -p "$NEUTRON_HOME"

          cd "$NEUTRON_HOME"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman
          ./antman -S=latest

          test -d "$NEUTRON_HOME/bin"

          cd "$NEUTRON_HOME/bin"

          if [ -x clang-24 ]; then
            ln -sfn clang-24 clang
            ln -sfn clang-24 clang++
          elif [ ! -x clang ]; then
            echo "::error::clang executable not found"
            find "$NEUTRON_HOME" -maxdepth 3 -type f | sort || true
            exit 1
          else
            ln -sfn "$(readlink -f clang)" clang++
          fi

          if [ -x lld ]; then
            ln -sfn lld ld.lld
          elif [ -x ld.lld ]; then
            ln -sfn "$(readlink -f ld.lld)" lld
          else
            echo "::error::lld executable not found"
            exit 1
          fi

          for TOOL in \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip; do
            test -x "$NEUTRON_HOME/bin/$TOOL"
          done

          echo "NEUTRON_BIN=$NEUTRON_HOME/bin" >> "$GITHUB_ENV"
          echo "$NEUTRON_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron compiler
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          test "$(command -v clang)" \
            = "$NEUTRON_HOME/bin/clang"

          test "$(command -v clang++)" \
            = "$NEUTRON_HOME/bin/clang++"

          test "$(command -v ld.lld)" \
            = "$NEUTRON_HOME/bin/ld.lld"

          test "$(command -v llvm-ar)" \
            = "$NEUTRON_HOME/bin/llvm-ar"

          clang --version
          clang++ --version
          ld.lld --version
          llvm-ar --version

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          clang --version > \
            "$GITHUB_WORKSPACE/build-info/neutron-clang-version.txt"

          ld.lld --version > \
            "$GITHUB_WORKSPACE/build-info/neutron-lld-version.txt"

          CLANG_ID="$(
            clang --version |
            head -n1 |
            sed 's/[[:space:]]+/ /g'
          )"

          echo "NEUTRON_CLANG_ID=$CLANG_ID" >> "$GITHUB_ENV"

      - name: Configure compiler in Android build config
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="common/build.config.gki.aarch64"

          test -f "$CONFIG"

          # Remove broken/external prebuilt paths.
          # The compiler will be selected from PATH.
          sed -i '/^CLANG_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM=/d' "$CONFIG"
          sed -i '/^LLVM_IAS=/d' "$CONFIG"
          sed -i '/^CC=/d' "$CONFIG"
          sed -i '/^HOSTCC=/d' "$CONFIG"
          sed -i '/^HOSTCXX=/d' "$CONFIG"
          sed -i '/^HOSTAR=/d' "$CONFIG"
          sed -i '/^HOSTLD=/d' "$CONFIG"
          sed -i '/^LD=/d' "$CONFIG"
          sed -i '/^AR=/d' "$CONFIG"
          sed -i '/^NM=/d' "$CONFIG"
          sed -i '/^OBJCOPY=/d' "$CONFIG"
          sed -i '/^OBJDUMP=/d' "$CONFIG"
          sed -i '/^READELF=/d' "$CONFIG"
          sed -i '/^STRIP=/d' "$CONFIG"

          cat >> "$CONFIG" <<'EOF'
          LLVM=1
          LLVM_IAS=1
          CC=clang
          HOSTCC=clang
          HOSTCXX=clang++
          HOSTAR=llvm-ar
          HOSTLD=ld.lld
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          STRIP=llvm-strip
          EOF

          grep -E \
            '^LLVM=|^LLVM_IAS=|^CC=|^HOSTCC=|^HOSTCXX=|^HOSTAR=|^HOSTLD=|^LD=|^AR=' \
            "$CONFIG"

      - name: Set kernel identity
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"
          BRAND="${{ github.event.inputs.kernel_brand }}"

          test -f "$DEFCONFIG"

          BRAND="$(
            printf '%s' "$BRAND" |
            tr -cd 'A-Za-z0-9_.+-' |
            cut -c1-50
          )"

          if [ -z "$BRAND" ]; then
            BRAND="Gaming-Kernel-NeutronClang"
          fi

          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<EOF
          CONFIG_LOCALVERSION="-$BRAND"
          CONFIG_LOCALVERSION_AUTO=n
          EOF

          grep -E \
            '^CONFIG_LOCALVERSION|^CONFIG_LOCALVERSION_AUTO' \
            "$DEFCONFIG"

      - name: Configure kernel options
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"

          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_WERROR=n
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ github.event.inputs.enable_performance }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=n
          EOF
          fi

          if [ "${{ github.event.inputs.enable_gaming }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_MODULE_FORCE_LOAD=y
          EOF
          fi

      - name: Remove stale metadata and bad checks
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path '*/include/generated/compile.h' \
            -type f \
            -delete || true

          find . \
            -name '.version' \
            -type f \
            -delete || true

          for FILE in common/build.config* build.config*; do
            if [ ! -f "$FILE" ]; then
              continue
            fi

            sed -i '/^check_defconfig$/d' "$FILE"
            sed -i '/^CHECK_DEFCONFIG=/d' "$FILE"
            sed -i '/^MODULES_ORDER=/d' "$FILE"
            sed -i '/^MODULES_LIST=/d' "$FILE"
          done

      - name: Embed Neutron compiler information
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          MKCOMPILE="scripts/mkcompile_h"

          if [ ! -f "$MKCOMPILE" ]; then
            echo "mkcompile_h not found; normal compiler detection will be used."
            exit 0
          fi

          cp "$MKCOMPILE" "$MKCOMPILE.original"

          python3 - "$MKCOMPILE" "$NEUTRON_CLANG_ID" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          compiler = sys.argv[2]
          compiler = compiler.replace("\\", "\\\\")
          compiler = compiler.replace('"', '\\"')

          text = path.read_text()
          lines = text.splitlines()

          output = []

          for line in lines:
              if "LINUX_COMPILER" in line and (
                  "$CC" in line or
                  "cc-version" in line or
                  "clang" in line
              ):
                  indent = line[:len(line) - len(line.lstrip())]
                  line = (
                      f'{indent}echo "#define LINUX_COMPILER '
                      f'\\"{compiler}\\""'
                  )

              output.append(line)

          path.write_text("
".join(output) + "
")
          PY

          grep -n "LINUX_COMPILER" "$MKCOMPILE" || true

      - name: Build kernel with Neutron Clang
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          # Kernel 5.10 uses LLVM=1 with tools available in PATH.
          export LLVM=1
          export LLVM_IAS=1

          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld

          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export LTO=thin
          export LLVM_PARALLEL_LINK_JOBS=1
          export LLVM_PARALLEL_COMPILE_JOBS=2

          export KBUILD_BUILD_USER=NeutronClang
          export KBUILD_BUILD_HOST=NeutronCI
          export KBUILD_BUILD_VERSION=1
          export KBUILD_COMPILER_STRING="$NEUTRON_CLANG_ID"

          unset CLANG_PREBUILT_BIN || true
          unset LLVM_PREBUILT_BIN || true

          test "$(command -v clang)" \
            = "$NEUTRON_HOME/bin/clang"

          test "$(command -v clang++)" \
            = "$NEUTRON_HOME/bin/clang++"

          test "$(command -v ld.lld)" \
            = "$NEUTRON_HOME/bin/ld.lld"

          echo "===== FINAL TOOLCHAIN ====="
          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-ar
          clang --version

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          HOSTCC=clang \
          HOSTCXX=clang++ \
          HOSTAR=llvm-ar \
          HOSTLD=ld.lld \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LTO=thin \
          KBUILD_COMPILER_STRING="$NEUTRON_CLANG_ID" \
          build/build.sh -j2

      - name: Verify compiler information
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          COMPILE_H="$(
            find out \
              -path '*/include/generated/compile.h' \
              -type f |
            head -n1
          )"

          if [ -z "$COMPILE_H" ] || [ ! -f "$COMPILE_H" ]; then
            echo "::error::compile.h was not generated."
            exit 1
          fi

          cp "$COMPILE_H" \
            "$GITHUB_WORKSPACE/build-info/compile.h"

          echo "===== compile.h ====="
          cat "$COMPILE_H"

          if ! grep -qi "clang" "$COMPILE_H"; then
            echo "::error::Clang information missing from compile.h."
            exit 1
          fi

          if grep -qiE \
            'clang version 10|clang version 11|clang version 12' \
            "$COMPILE_H"; then
            echo "::error::Old compiler metadata detected."
            exit 1
          fi

          grep -E \
            'LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST|UTS_VERSION' \
            "$COMPILE_H" \
            > "$GITHUB_WORKSPACE/build-info/compiler-proof.txt" \
            || true

      - name: Verify kernel release
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_FILE="$(
            find out \
              -name utsrelease.h \
              -type f |
            head -n1
          )"

          if [ -n "$RELEASE_FILE" ] && [ -f "$RELEASE_FILE" ]; then
            cp "$RELEASE_FILE" \
              "$GITHUB_WORKSPACE/build-info/utsrelease.h"

            cat "$RELEASE_FILE"
          fi

      - name: Locate final Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find out \
              -path '*/dist/Image' \
              -type f |
            head -n1
          )"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(
              find out \
                -name Image \
                -type f |
              head -n1
            )"
          fi

          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::Final Image was not found."
            find out -maxdepth 6 -type f | sort || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$IMAGE" \
            "$GITHUB_WORKSPACE/build-info/Image"

          sha256sum "$IMAGE" | tee \
            "$GITHUB_WORKSPACE/build-info/Image.sha256"

          echo "IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/$IMAGE" \
            >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            AnyKernel3

          cp "$IMAGE_PATH" AnyKernel3/Image

          SOURCE_HASH="$(
            sha256sum "$IMAGE_PATH" |
            awk '{print $1}'
          )"

          PACKAGE_HASH="$(
            sha256sum AnyKernel3/Image |
            awk '{print $1}'
          )"

          test "$SOURCE_HASH" = "$PACKAGE_HASH"

          ZIP_NAME="${{ github.event.inputs.device_name }}-NeutronClang-FKM.zip"

          cd AnyKernel3

          zip -r9 -q "../$ZIP_NAME" . \
            -x ".git*" \
            -x "*.zip"

          cd ..

          sha256sum "$ZIP_NAME" \
            > "build-info/$ZIP_NAME.sha256"

      - name: Print build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Kernel name: ${{ github.event.inputs.kernel_brand }}"
          echo "Compiler: $NEUTRON_CLANG_ID"
          echo "LTO: Thin"
          echo "Compiler is embedded in compile.h."

          ccache --show-stats || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-NeutronClang-FKM
          path: |
            *.zip
            build-info/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-diagnostics
          path: |
            kernel_workspace/out/**/*.log
            kernel_workspace/out/**/compile.h
            build-info/**
          if-no-files-found: ignore
          retention-days: 7
