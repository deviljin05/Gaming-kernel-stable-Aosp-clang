name: Build GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Android kernel manifest branch"
        required: true
        default: "common-android12-5.10"

      kernel_ref:
        description: "Optional common kernel branch/tag; leave empty for manifest revision"
        required: false
        default: ""

      device_name:
        description: "Name for the ZIP artifact"
        required: true
        default: "gki-kernel"

      enable_performance:
        description: "Enable performance CPU governor"
        required: true
        default: "false"

      enable_gaming:
        description: "Enable optional gaming config"
        required: true
        default: "false"

env:
  KERNEL_MANIFEST:
    https://android.googlesource.com/kernel/manifest

  NEUTRON_HOME: /home/runner/toolchains/neutron-clang
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize kernel source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          # --repo-rev=main fixes the old "unable to resolve stable" error.
          repo init \
            -u "$KERNEL_MANIFEST" \
            -b "${{ github.event.inputs.kernel_branch }}" \
            --repo-url=https://gerrit.googlesource.com/git-repo \
            --repo-rev=main \
            --no-repo-verify \
            --depth=1

      - name: Sync kernel source
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Checkout optional kernel reference
        if: ${{ github.event.inputs.kernel_ref != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ github.event.inputs.kernel_ref }}"

          git fetch --depth=1 origin "$REF"

          if git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            git checkout -B "$REF" "origin/$REF"
          elif git rev-parse --verify --quiet "$REF^{commit}"; then
            git checkout "$REF"
          else
            echo "::error::Kernel reference not found: $REF"
            exit 1
          fi

      - name: Setup ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_HOME"
          mkdir -p "$NEUTRON_HOME"

          cd "$NEUTRON_HOME"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman
          ./antman -S=latest

          test -d "$NEUTRON_HOME/bin"
          test -x "$NEUTRON_HOME/bin/clang-24"
          test -x "$NEUTRON_HOME/bin/lld"

          cd "$NEUTRON_HOME/bin"

          ln -sfn clang-24 clang
          ln -sfn clang-24 clang++
          ln -sfn lld ld.lld

          echo "NEUTRON_BIN=$NEUTRON_HOME/bin" >> "$GITHUB_ENV"
          echo "$NEUTRON_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron compiler
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          test -x "$NEUTRON_HOME/bin/clang"
          test -x "$NEUTRON_HOME/bin/clang-24"
          test -x "$NEUTRON_HOME/bin/clang++"
          test -x "$NEUTRON_HOME/bin/lld"
          test -x "$NEUTRON_HOME/bin/ld.lld"

          test "$(readlink -f "$(command -v clang)")" \
            = "$NEUTRON_HOME/bin/clang-24"

          test "$(readlink -f "$(command -v clang++)")" \
            = "$NEUTRON_HOME/bin/clang-24"

          test "$(readlink -f "$(command -v ld.lld)")" \
            = "$NEUTRON_HOME/bin/lld"

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          clang --version | tee \
            "$GITHUB_WORKSPACE/build-info/clang-version.txt"

          ld.lld --version | tee \
            "$GITHUB_WORKSPACE/build-info/lld-version.txt"

      - name: Configure build compiler
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="common/build.config.gki.aarch64"

          test -f "$CONFIG"

          # This path is relative to kernel_workspace.
          # Do not use /home/runner/... here.
          TOOLCHAIN_REL="../toolchains/neutron-clang/bin"

          sed -i '/^CLANG_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM=/d' "$CONFIG"
          sed -i '/^LLVM_IAS=/d' "$CONFIG"
          sed -i '/^CC=/d' "$CONFIG"
          sed -i '/^HOSTCC=/d' "$CONFIG"
          sed -i '/^HOSTCXX=/d' "$CONFIG"
          sed -i '/^LD=/d' "$CONFIG"
          sed -i '/^AR=/d' "$CONFIG"
          sed -i '/^NM=/d' "$CONFIG"
          sed -i '/^OBJCOPY=/d' "$CONFIG"
          sed -i '/^OBJDUMP=/d' "$CONFIG"
          sed -i '/^READELF=/d' "$CONFIG"
          sed -i '/^STRIP=/d' "$CONFIG"

          cat >> "$CONFIG" <<EOF
          CLANG_PREBUILT_BIN=$TOOLCHAIN_REL/
          LLVM_PREBUILT_BIN=$TOOLCHAIN_REL/
          LLVM=1
          LLVM_IAS=1
          CC=clang
          HOSTCC=clang
          HOSTCXX=clang++
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          STRIP=llvm-strip
          EOF

          echo "===== Compiler configuration ====="

          grep -E \
            'CLANG_PREBUILT_BIN|LLVM_PREBUILT_BIN|^LLVM=|^CC=|^HOSTCC=|^LD=|^AR=' \
            "$CONFIG"

      - name: Validate relative compiler path
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD"
          TOOLCHAIN_REL="../toolchains/neutron-clang/bin"
          RESOLVED="$(readlink -f "$ROOT/$TOOLCHAIN_REL")"

          test "$RESOLVED" = "$NEUTRON_HOME/bin"
          test -x "$RESOLVED/clang"
          test -x "$RESOLVED/clang-24"
          test -x "$RESOLVED/lld"
          test -x "$RESOLVED/ld.lld"

          echo "ROOT=$ROOT"
          echo "TOOLCHAIN_REL=$TOOLCHAIN_REL"
          echo "RESOLVED=$RESOLVED"

          "$RESOLVED/clang" --version

      - name: Remove stale compiler metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path '*/include/generated/compile.h' \
            -type f \
            -delete || true

          find . \
            -name '.version' \
            -type f \
            -delete || true

      - name: Setup KernelSU Next if available
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "KernelSU-Next/kernel/setup.sh" ]; then
            bash KernelSU-Next/kernel/setup.sh
          else
            echo "KernelSU-Next setup script not found; continuing."
          fi

      - name: Configure kernel options
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"

          test -f "$DEFCONFIG"

          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_WERROR=n
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ github.event.inputs.enable_performance }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=n
          EOF
          fi

          if [ "${{ github.event.inputs.enable_gaming }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_MODULE_FORCE_LOAD=y
          EOF
          fi

      - name: Disable incompatible build checks
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          for FILE in common/build.config* build.config*; do
            if [ ! -f "$FILE" ]; then
              continue
            fi

            sed -i '/^check_defconfig$/d' "$FILE"
            sed -i '/^CHECK_DEFCONFIG=/d' "$FILE"
            sed -i '/^MODULES_ORDER=/d' "$FILE"
            sed -i '/^MODULES_LIST=/d' "$FILE"
          done

          echo "Build-check cleanup completed."

      - name: Build kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export LTO=thin
          export LLVM_PARALLEL_LINK_JOBS=1
          export LLVM_PARALLEL_COMPILE_JOBS=2
          export KBUILD_BUILD_USER=github-actions
          export KBUILD_BUILD_HOST=github-runner

          # Prevent build.sh from receiving the previous broken absolute path.
          unset CLANG_PREBUILT_BIN || true
          unset LLVM_PREBUILT_BIN || true

          test "$(readlink -f "$(command -v clang)")" \
            = "$NEUTRON_HOME/bin/clang-24"

          test "$(readlink -f "$(command -v ld.lld)")" \
            = "$NEUTRON_HOME/bin/lld"

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          LTO=thin \
          build/build.sh -j2

      - name: Verify compile metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          COMPILE_H="$(
            find out \
              -path '*/include/generated/compile.h' \
              -type f |
            head -n1
          )"

          if [ -z "$COMPILE_H" ] || [ ! -f "$COMPILE_H" ]; then
            echo "::error::compile.h was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$COMPILE_H" \
            "$GITHUB_WORKSPACE/build-info/compile.h"

          echo "===== compile.h ====="
          cat "$COMPILE_H"

          if grep -qiE \
            'clang version 10|clang version 11|clang version 12' \
            "$COMPILE_H"; then
            echo "::error::Old compiler metadata detected."
            exit 1
          fi

          grep -E \
            'LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST' \
            "$COMPILE_H" \
            > "$GITHUB_WORKSPACE/build-info/compiler-proof.txt" || true

      - name: Find final Image
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$(
            find out \
              -path '*/dist/Image' \
              -type f |
            head -n1
          )"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(
              find out \
                -name Image \
                -type f |
              head -n1
            )"
          fi

          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::Image was not found."
            find out -maxdepth 6 -type f | sort || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          cp "$IMAGE" \
            "$GITHUB_WORKSPACE/build-info/Image"

          sha256sum "$IMAGE" | tee \
            "$GITHUB_WORKSPACE/build-info/Image.sha256"

          echo "IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/$IMAGE" \
            >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            AnyKernel3

          cp "$IMAGE_PATH" AnyKernel3/Image

          SOURCE_HASH="$(sha256sum "$IMAGE_PATH" | awk '{print $1}')"
          PACKAGE_HASH="$(sha256sum AnyKernel3/Image | awk '{print $1}')"

          test "$SOURCE_HASH" = "$PACKAGE_HASH"

          ZIP_NAME="${{ github.event.inputs.device_name }}-NeutronClang24.zip"

          cd AnyKernel3

          zip -r9 -q "../$ZIP_NAME" . \
            -x ".git*" \
            -x "*.zip"

          cd ..

          sha256sum "$ZIP_NAME" \
            > "build-info/$ZIP_NAME.sha256"

      - name: Show build information
        shell: bash
        run: |
          set -euo pipefail

          echo "Device: ${{ github.event.inputs.device_name }}"
          echo "Kernel branch: ${{ github.event.inputs.kernel_branch }}"
          echo "Kernel ref: ${{ github.event.inputs.kernel_ref }}"
          echo "Compiler: Neutron Clang 24"
          echo "LTO: thin"

          ccache --show-stats || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-NeutronClang24
          path: |
            *.zip
            build-info/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-diagnostics
          path: |
            kernel_workspace/out/**/*.log
            kernel_workspace/out/**/compile.h
            build-info/**
          if-no-files-found: ignore
          retention-days: 7
