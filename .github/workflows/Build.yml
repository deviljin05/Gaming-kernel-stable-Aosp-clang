name: Build GKI Kernel - Neutron Clang

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: Android kernel manifest branch
        required: true
        type: string
        default: common-android12-5.10

      kernel_ref:
        description: Optional common kernel tag or branch
        required: false
        type: string
        default: ""

      device_name:
        description: Device/kernel artifact name
        required: true
        type: string
        default: Gaming-Kernel

      kernel_brand:
        description: Kernel name shown in kernel manager
        required: true
        type: string
        default: Gaming-Kernel-NeutronClang

      enable_performance:
        description: Enable performance governor
        required: true
        type: boolean
        default: false

      enable_gaming:
        description: Enable gaming options
        required: true
        type: boolean
        default: false

env:
  MANIFEST_URL: https://android.googlesource.com/kernel/manifest
  REPO_URL: https://gerrit.googlesource.com/git-repo
  NEUTRON_HOME: /home/runner/toolchains/neutron-clang
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libncurses-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo apt-get clean

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install repo launcher
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize kernel source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel_workspace
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u "$MANIFEST_URL" \
            -b "${{ inputs.kernel_branch }}" \
            --repo-url="$REPO_URL" \
            --repo-rev=main \
            --no-repo-verify \
            --depth=1

      - name: Sync kernel source
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Checkout optional kernel ref
        if: ${{ inputs.kernel_ref != '' }}
        working-directory: kernel_workspace/common
        shell: bash
        run: |
          set -euo pipefail

          REF="${{ inputs.kernel_ref }}"

          git fetch --depth=1 origin "$REF" || true

          if git show-ref --verify --quiet "refs/remotes/origin/$REF"; then
            git checkout -B "$REF" "origin/$REF"
          elif git rev-parse --verify --quiet "$REF^{commit}"; then
            git checkout "$REF"
          else
            echo "::error::Kernel ref not found: $REF"
            exit 1
          fi

      - name: Setup ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Install Neutron Clang
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$NEUTRON_HOME"
          mkdir -p "$NEUTRON_HOME"

          cd "$NEUTRON_HOME"

          curl -fsSL \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          chmod +x antman
          ./antman -S=latest

          test -d "$NEUTRON_HOME/bin"

          if [ ! -x "$NEUTRON_HOME/bin/clang" ] && \
             [ -x "$NEUTRON_HOME/bin/clang-24" ]; then
            ln -sfn clang-24 "$NEUTRON_HOME/bin/clang"
          fi

          if [ ! -x "$NEUTRON_HOME/bin/clang++" ] && \
             [ -x "$NEUTRON_HOME/bin/clang-24" ]; then
            ln -sfn clang-24 "$NEUTRON_HOME/bin/clang++"
          fi

          if [ ! -x "$NEUTRON_HOME/bin/ld.lld" ] && \
             [ -x "$NEUTRON_HOME/bin/lld" ]; then
            ln -sfn lld "$NEUTRON_HOME/bin/ld.lld"
          fi

          test -x "$NEUTRON_HOME/bin/clang"
          test -x "$NEUTRON_HOME/bin/clang++"
          test -x "$NEUTRON_HOME/bin/ld.lld"
          test -x "$NEUTRON_HOME/bin/llvm-ar"

          echo "NEUTRON_BIN=$NEUTRON_HOME/bin" >> "$GITHUB_ENV"
          echo "$NEUTRON_HOME/bin" >> "$GITHUB_PATH"

      - name: Verify Neutron toolchain
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          test "$(command -v clang)" = "$NEUTRON_HOME/bin/clang"
          test "$(command -v clang++)" = "$NEUTRON_HOME/bin/clang++"
          test "$(command -v ld.lld)" = "$NEUTRON_HOME/bin/ld.lld"
          test "$(command -v llvm-ar)" = "$NEUTRON_HOME/bin/llvm-ar"

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          command -v clang | tee \
            "$GITHUB_WORKSPACE/build-info/compiler-path.txt"

          clang --version | tee \
            "$GITHUB_WORKSPACE/build-info/neutron-clang-version.txt"

          ld.lld --version | tee \
            "$GITHUB_WORKSPACE/build-info/neutron-lld-version.txt"

          CLANG_ID="$(
            clang --version |
            head -n1 |
            sed 's/[[:space:]]+/ /g'
          )"

          echo "NEUTRON_CLANG_ID=$CLANG_ID" >> "$GITHUB_ENV"

      - name: Configure Android kernel compiler
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="common/build.config.gki.aarch64"

          test -f "$CONFIG"

          sed -i '/^CLANG_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM_PREBUILT_BIN=/d' "$CONFIG"
          sed -i '/^LLVM=/d' "$CONFIG"
          sed -i '/^LLVM_IAS=/d' "$CONFIG"
          sed -i '/^CC=/d' "$CONFIG"
          sed -i '/^HOSTCC=/d' "$CONFIG"
          sed -i '/^HOSTCXX=/d' "$CONFIG"
          sed -i '/^HOSTAR=/d' "$CONFIG"
          sed -i '/^HOSTLD=/d' "$CONFIG"
          sed -i '/^LD=/d' "$CONFIG"
          sed -i '/^AR=/d' "$CONFIG"
          sed -i '/^NM=/d' "$CONFIG"
          sed -i '/^OBJCOPY=/d' "$CONFIG"
          sed -i '/^OBJDUMP=/d' "$CONFIG"
          sed -i '/^READELF=/d' "$CONFIG"
          sed -i '/^STRIP=/d' "$CONFIG"

          cat >> "$CONFIG" <<'EOF'
          LLVM=1
          LLVM_IAS=1
          CC=clang
          HOSTCC=clang
          HOSTCXX=clang++
          HOSTAR=llvm-ar
          HOSTLD=ld.lld
          LD=ld.lld
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          READELF=llvm-readelf
          STRIP=llvm-strip
          EOF

          grep -E \
            '^LLVM=|^LLVM_IAS=|^CC=|^HOSTCC=|^HOSTCXX=|^HOSTAR=|^HOSTLD=|^LD=|^AR=' \
            "$CONFIG"

      - name: Set kernel manager name
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"
          BRAND="${{ inputs.kernel_brand }}"

          test -f "$DEFCONFIG"

          BRAND="$(
            printf '%s' "$BRAND" |
            tr -cd 'A-Za-z0-9_.+-' |
            cut -c1-50
          )"

          if [ -z "$BRAND" ]; then
            BRAND="Gaming-Kernel-NeutronClang"
          fi

          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"

          printf 'CONFIG_LOCALVERSION="-%s"
' "$BRAND" \
            >> "$DEFCONFIG"

          printf '%s
' 'CONFIG_LOCALVERSION_AUTO=n' \
            >> "$DEFCONFIG"

          grep -E \
            '^CONFIG_LOCALVERSION|^CONFIG_LOCALVERSION_AUTO' \
            "$DEFCONFIG"

      - name: Configure kernel options
        working-directory: kernel_workspace/common/arch/arm64/configs
        shell: bash
        run: |
          set -euo pipefail

          DEFCONFIG="gki_defconfig"

          cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          CONFIG_WERROR=n
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_USER_NS=y
          CONFIG_IPC_NS=y
          CONFIG_CGROUPS=y
          CONFIG_DEVTMPFS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ inputs.enable_performance }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=n
          EOF
          fi

          if [ "${{ inputs.enable_gaming }}" = "true" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_MODULE_FORCE_LOAD=y
          EOF
          fi

      - name: Remove stale build metadata
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          find . \
            -path '*/include/generated/compile.h' \
            -type f \
            -delete || true

          find . \
            -name '.version' \
            -type f \
            -delete || true

      - name: Build kernel
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$NEUTRON_HOME/bin:$PATH"

          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export HOSTAR=llvm-ar
          export HOSTLD=ld.lld
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip

          export LTO=thin
          export LLVM_PARALLEL_LINK_JOBS=1
          export LLVM_PARALLEL_COMPILE_JOBS=2
          export KBUILD_BUILD_USER=NeutronClang
          export KBUILD_BUILD_HOST=NeutronCI

          unset CLANG_PREBUILT_BIN || true
          unset LLVM_PREBUILT_BIN || true

          test "$(command -v clang)" = "$NEUTRON_HOME/bin/clang"
          test "$(command -v clang++)" = "$NEUTRON_HOME/bin/clang++"
          test "$(command -v ld.lld)" = "$NEUTRON_HOME/bin/ld.lld"

          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="$CCACHE_DIR" \
          LLVM=1 \
          LLVM_IAS=1 \
          CC=clang \
          HOSTCC=clang \
          HOSTCXX=clang++ \
          HOSTAR=llvm-ar \
          HOSTLD=ld.lld \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          READELF=llvm-readelf \
          STRIP=llvm-strip \
          LTO=thin \
          build/build.sh -j2

      - name: Verify build output
        working-directory: kernel_workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-info"

          COMPILE_H="$(
            find out \
              -path '*/include/generated/compile.h' \
              -type f |
            head -n1
          )"

          if [ -n "$COMPILE_H" ] && [ -f "$COMPILE_H" ]; then
            cp "$COMPILE_H" \
              "$GITHUB_WORKSPACE/build-info/compile.h"

            grep -E \
              'LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST|UTS_VERSION' \
              "$COMPILE_H" \
              > "$GITHUB_WORKSPACE/build-info/compiler-proof.txt" \
              || true
          fi

          IMAGE="$(
            find out \
              -path '*/dist/Image' \
              -type f |
            head -n1
          )"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(
              find out \
                -name Image \
                -type f |
              head -n1
            )"
          fi

          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "::error::Final Image not found"
            find out -maxdepth 6 -type f | sort || true
            exit 1
          fi

          cp "$IMAGE" \
            "$GITHUB_WORKSPACE/build-info/Image"

          sha256sum "$IMAGE" | tee \
            "$GITHUB_WORKSPACE/build-info/Image.sha256"

          echo "IMAGE_PATH=$GITHUB_WORKSPACE/kernel_workspace/$IMAGE" \
            >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            -b gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git \
            AnyKernel3

          cp "$IMAGE_PATH" AnyKernel3/Image

          SOURCE_HASH="$(
            sha256sum "$IMAGE_PATH" |
            awk '{print $1}'
          )"

          PACKAGE_HASH="$(
            sha256sum AnyKernel3/Image |
            awk '{print $1}'
          )"

          test "$SOURCE_HASH" = "$PACKAGE_HASH"

          ZIP_NAME="${{ inputs.device_name }}-NeutronClang-FKM.zip"

          cd AnyKernel3

          zip -r9 -q "../$ZIP_NAME" . \
            -x ".git*" \
            -x "*.zip"

          cd ..

          sha256sum "$ZIP_NAME" \
            > "build-info/$ZIP_NAME.sha256"

      - name: Print build summary
        shell: bash
        run: |
          set -euo pipefail

          echo "Kernel: ${{ inputs.kernel_brand }}"
          echo "Compiler: $NEUTRON_CLANG_ID"
          echo "LTO: Thin"

          ccache --show-stats || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.device_name }}-NeutronClang-FKM
          path: |
            *.zip
            build-info/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build-diagnostics
          path: |
            kernel_workspace/out/**/*.log
            kernel_workspace/out/**/compile.h
            build-info/**
          if-no-files-found: ignore
          retention-days: 7
