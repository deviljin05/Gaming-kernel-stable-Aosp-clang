name: Build Android 12 GKI Kernel - Neutron Clang - All Patches

"on":
  workflow_dispatch:
    inputs:
      os_patch_level:
        description: "Exact GKI tag, for example android12-5.10.264_r00"
        required: true
        default: "android12-5.10.264_r00"
        type: string

      susfs_commit:
        description: "Optional SUSFS commit hash"
        required: false
        default: ""
        type: string

      device_name:
        description: "Artifact label"
        required: false
        default: "gki-custom"
        type: string

      compiler_release:
        description: "Neutron Clang release, blank uses latest"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  VERSION: android12-5.10
  TOOLCHAIN_ROOT: ${{ github.workspace }}/toolchains/neutron-clang
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: Build GKI with All Experimental Patches
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

          df -h

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lld \
            llvm \
            pahole \
            patchelf \
            perl \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            zstd

          command -v bash
          command -v git
          command -v curl
          command -v python3
          command -v make
          command -v patch

      - name: Configure Git
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install repo tool
        run: |
          set -euo pipefail

          mkdir -p "$HOME/bin"

          curl -fL --retry 5 --retry-delay 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          test -s "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Prepare ccache
        run: |
          set -euo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=8G
          ccache --zero-stats

      - name: Download Neutron Clang
        run: |
          set -euo pipefail

          mkdir -p "$TOOLCHAIN_ROOT"
          cd "$TOOLCHAIN_ROOT"

          curl -fL --retry 5 --retry-delay 5 \
            https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman \
            -o antman

          test -s antman
          chmod +x antman

          RELEASE="${{ inputs.compiler_release }}"

          if [ -n "$RELEASE" ]; then
            ./antman -S="$RELEASE"
          else
            ./antman -S
          fi

          echo "AntMan information:"
          ./antman -I || true

          echo "Searching Neutron binaries..."

          CLANG_PATH="$(
            find "$TOOLCHAIN_ROOT" \
              -type f \
              -name clang \
              -perm -111 \
              | head -n1 || true
          )"

          CLANGXX_PATH="$(
            find "$TOOLCHAIN_ROOT" \
              -type f \
              -name clang++ \
              -perm -111 \
              | head -n1 || true
          )"

          LLD_PATH="$(
            find "$TOOLCHAIN_ROOT" \
              -type f \
              -name ld.lld \
              -perm -111 \
              | head -n1 || true
          )"

          if [ -z "$CLANG_PATH" ] || [ -z "$CLANGXX_PATH" ] || [ -z "$LLD_PATH" ]; then
            echo "ERROR: Neutron Clang binaries were not found."
            echo "Toolchain contents:"
            find "$TOOLCHAIN_ROOT" -maxdepth 7 -type f | sort | head -n 400
            exit 1
          fi

          TOOLCHAIN_BIN="$(dirname "$CLANG_PATH")"

          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"

          echo "Neutron binary directory: $TOOLCHAIN_BIN"

      - name: Verify Neutron Clang
        run: |
          set -euo pipefail

          test -n "${TOOLCHAIN_BIN:-}"

          test -x "$TOOLCHAIN_BIN/clang"
          test -x "$TOOLCHAIN_BIN/clang++"
          test -x "$TOOLCHAIN_BIN/ld.lld"
          test -x "$TOOLCHAIN_BIN/llvm-ar"
          test -x "$TOOLCHAIN_BIN/llvm-nm"
          test -x "$TOOLCHAIN_BIN/llvm-objcopy"
          test -x "$TOOLCHAIN_BIN/llvm-objdump"
          test -x "$TOOLCHAIN_BIN/llvm-readelf"
          test -x "$TOOLCHAIN_BIN/llvm-strip"

          "$TOOLCHAIN_BIN/clang" --version
          "$TOOLCHAIN_BIN/clang++" --version
          "$TOOLCHAIN_BIN/ld.lld" --version

          cat > "$RUNNER_TEMP/neutron-test.c" <<'EOF'
          int main(void)
          {
              return 0;
          }
          EOF

          "$TOOLCHAIN_BIN/clang" \
            -O2 \
            -fno-lto \
            -fno-pie \
            -no-pie \
            "$RUNNER_TEMP/neutron-test.c" \
            -o "$RUNNER_TEMP/neutron-test"

          "$RUNNER_TEMP/neutron-test"

          echo "Neutron Clang verification successful."

      - name: Resolve kernel manifest
        run: |
          set -euo pipefail

          INPUT="${{ inputs.os_patch_level }}"

          if [ "$INPUT" = "lts" ]; then
            echo "MANIFEST_REF=common-${VERSION}-lts" >> "$GITHUB_ENV"
            echo "PIN_TYPE=" >> "$GITHUB_ENV"
            echo "PIN_REF=" >> "$GITHUB_ENV"

          elif [[ "$INPUT" =~ ^android12-5.10.[0-9]+_r[0-9]+$ ]]; then
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=tag" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"

          else
            echo "MANIFEST_REF=common-${VERSION}" >> "$GITHUB_ENV"
            echo "PIN_TYPE=branch" >> "$GITHUB_ENV"
            echo "PIN_REF=$INPUT" >> "$GITHUB_ENV"
          fi

          echo "MANIFEST_REF=$MANIFEST_REF"
          echo "PIN_TYPE=$PIN_TYPE"
          echo "PIN_REF=$PIN_REF"

      - name: Initialize Android kernel manifest
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b "$MANIFEST_REF" \
            --depth=1

      - name: Sync Android kernel source
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          repo sync \
            -c \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            -j2

      - name: Pin common kernel
        if: ${{ env.PIN_TYPE != '' }}
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          REMOTE="$(git remote | head -n1)"

          if [ "$PIN_TYPE" = "tag" ]; then
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/tags/$PIN_REF:refs/tags/$PIN_REF"

            git checkout "refs/tags/$PIN_REF"
          else
            git fetch \
              --depth=1 \
              "$REMOTE" \
              "refs/heads/$PIN_REF:refs/remotes/$REMOTE/$PIN_REF"

            git checkout -B \
              "$PIN_REF" \
              "refs/remotes/$REMOTE/$PIN_REF"
          fi

          git describe --always --dirty

      - name: Read kernel sublevel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          SUBLEVEL_VALUE="$(
            awk -F '= ' '/^SUBLEVEL = / {print $2; exit}' common/Makefile
          )"

          test -n "$SUBLEVEL_VALUE"

          echo "SUBLEVEL=$SUBLEVEL_VALUE" >> "$GITHUB_ENV"
          echo "Kernel sublevel: $SUBLEVEL_VALUE"

      - name: Clone SUSFS
        working-directory: kernel_workspace
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b gki-android12-5.10 \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            susfs4ksu

          if [ -n "${{ inputs.susfs_commit }}" ]; then
            cd susfs4ksu

            git fetch \
              --depth=1 \
              origin \
              "${{ inputs.susfs_commit }}"

            git checkout "${{ inputs.susfs_commit }}"
          fi

          echo "SUSFS_COMMIT=$(git -C susfs4ksu rev-parse HEAD)" \
            >> "$GITHUB_ENV"

      - name: Copy SUSFS files
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          cp \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
            ./50_add_susfs_in_gki-android12-5.10.patch

          test -f 50_add_susfs_in_gki-android12-5.10.patch

      - name: Apply SUSFS patch
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          PATCH_FILE="50_add_susfs_in_gki-android12-5.10.patch"

          if git apply --check --whitespace=nowarn "$PATCH_FILE" 2>/dev/null; then
            git apply --whitespace=nowarn "$PATCH_FILE"
          else
            echo "SUSFS patch already applied or not cleanly applicable."
          fi

      - name: Install KernelSU Next
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          curl -fsSL \
            https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh \
            | bash -s dev-susfs

          test -d KernelSU-Next

      - name: Apply KernelSU static patch
        working-directory: kernel_workspace/common/KernelSU-Next
        run: |
          set -euo pipefail

          curl -fsSL \
            -o static.patch \
            https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/kernelsu/patches/static.patch

          if git apply --check static.patch 2>/dev/null; then
            git apply static.patch
          else
            echo "KernelSU static patch already applied or skipped."
          fi

      - name: SUSFS compatibility fixes
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 43 ]; then
            sed -i \
              's/int[[:space:]]+this_len[[:space:]]*=[[:space:]]*min_t(size_t,/size_t this_len = min_t(size_t,/' \
              fs/proc/base.c || true
          fi

          if [ "$SUBLEVEL" -le 117 ]; then
            sed -i \
              's/mask,[[:space:]]*mark->ignored_mask/inotify_mark_user_mask(mark)/g' \
              fs/notify/fdinfo.c || true

            sed -i \
              's/ignored_mask:%x/ignored_mask:0/g' \
              fs/notify/fdinfo.c || true
          fi

          if [ "$SUBLEVEL" -le 209 ]; then
            sed -i \
              's/goto show_pad;/return 0;/g' \
              fs/proc/task_mmu.c || true
          fi

          sed -i \
            's/set_nameidata(nd, old_dfd, fake_filename, NULL);/set_nameidata(nd, old_dfd, fake_filename);/g' \
            fs/namei.c || true

      - name: Apply BBRv3
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          rm -rf /tmp/wildpatches

          git clone \
            --depth=1 \
            https://github.com/WildKernels/kernel_patches.git \
            /tmp/wildpatches

          BBR_PATCH="/tmp/wildpatches/common/bbrv3/0001-net-tcp-backport-BBRv3-to-android12-5.10.patch"
          BBR_NAME="bbr"
          BBR_APPLIED="false"

          if [ -f "$BBR_PATCH" ]; then
            if git apply --check "$BBR_PATCH" 2>/dev/null; then
              git apply "$BBR_PATCH"
              BBR_APPLIED="true"
            else
              echo "BBRv3 patch already applied or incompatible."
            fi
          else
            echo "BBRv3 patch was not found."
          fi

          if [ "$BBR_APPLIED" = "true" ]; then
            DETECTED="$(
              grep -rhoE 'name[[:space:]]*=[[:space:]]*"[^"]+"' \
                net/ipv4/tcp_bbr*.c 2>/dev/null \
                | grep -oE '"[^"]+"' \
                | tr -d '"' \
                | head -n1 || true
            )"

            if [ -n "$DETECTED" ]; then
              BBR_NAME="$DETECTED"
            fi
          fi

          echo "BBR_NAME=$BBR_NAME" >> "$GITHUB_ENV"
          echo "BBR_APPLIED=$BBR_APPLIED" >> "$GITHUB_ENV"

      - name: Configure BBRv3 and networking
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          CONFIG="arch/arm64/configs/gki_defconfig"

          cat >> "$CONFIG" <<EOF
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BIC=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_TCP_CONG_HTCP=y
          CONFIG_DEFAULT_TCP_CONG=$BBR_NAME
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_NET_SCH_CAKE=y
          EOF

          if [ "$BBR_APPLIED" = "true" ]; then
            echo "CONFIG_TCP_CONG_BBR3=y" >> "$CONFIG"
          fi

      - name: Apply NTSync
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          if [ "$SUBLEVEL" -le 208 ]; then
            curl -fsSL \
              -o /tmp/ntsync-lockdep.patch \
              https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch

            if git apply --check /tmp/ntsync-lockdep.patch 2>/dev/null; then
              git apply /tmp/ntsync-lockdep.patch
            else
              echo "NTSync lockdep patch already applied or skipped."
            fi
          fi

          curl -fsSL \
            -o /tmp/ntsync-compat.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch

          if git apply --check /tmp/ntsync-compat.patch 2>/dev/null; then
            git apply /tmp/ntsync-compat.patch
          else
            echo "NTSync compatibility patch already applied or skipped."
          fi

          curl -fsSL \
            -o /tmp/ntsync-base.patch \
            https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch

          if git apply --check /tmp/ntsync-base.patch 2>/dev/null; then
            git apply /tmp/ntsync-base.patch
          else
            echo "NTSync base patch already applied or skipped."
          fi

      - name: Configure NTSync
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          echo "CONFIG_NTSYNC=y" \
            >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail

          DROIDSPACES_OK="true"

          curl -fsSL \
            -o /tmp/droidspaces-sysvipc.patch \
            https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch

          if git apply --check /tmp/droidspaces-sysvipc.patch 2>/dev/null; then
            git apply /tmp/droidspaces-sysvipc.patch
          else
            echo "Droidspaces SYSVIPC patch already applied or incompatible."
            DROIDSPACES_OK="false"
          fi

          curl -fsSL \
            -o /tmp/droidspaces-mqueue.patch \
      
